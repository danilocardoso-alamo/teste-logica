<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jogos de lógica do Danilo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
:root{
  --page:#EDF3EF; --ink:#1B2A28; --ink-2:#51625E; --panel:#FFFFFF; --line:#D3E0DA;
  --accent:#E0701C; --accent-ink:#FFFFFF; --accent-2:#7B3FA3;
  --danger:#C23A2E; --danger-bg:#FCEBE8; --ok:#2C8249; --ok-bg:#E4F3E8;
  --hint:#F3B61F; --hint-bg:#FFF6DA; --focus:#1C6DD0; --ico-bg:#E4EEEA;
  --board:#F4F8F6; --board-2:#E6EFEA; --board-line:#CBDAD3;
  --radius:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --page:#0E1615; --ink:#E4EEEA; --ink-2:#9CB1AB; --panel:#16201E; --line:#2A3A36;
    --accent:#F0873A; --accent-ink:#1A0F05; --accent-2:#C79BEA;
    --danger:#FF7A6B; --danger-bg:#3A1C19; --ok:#63C985; --ok-bg:#15301F;
    --hint:#F6C443; --hint-bg:#3A3112; --focus:#6FA8FF; --ico-bg:#22302D;
    --board:#111A19; --board-2:#1A2523; --board-line:#2E3F3B;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0E1615; --ink:#E4EEEA; --ink-2:#9CB1AB; --panel:#16201E; --line:#2A3A36;
  --accent:#F0873A; --accent-ink:#1A0F05; --accent-2:#C79BEA;
  --danger:#FF7A6B; --danger-bg:#3A1C19; --ok:#63C985; --ok-bg:#15301F;
  --hint:#F6C443; --hint-bg:#3A3112; --focus:#6FA8FF; --ico-bg:#22302D;
  --board:#111A19; --board-2:#1A2523; --board-line:#2E3F3B;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--page);color:var(--ink);font:400 16px/1.5 "Nunito",ui-rounded,"Segoe UI",system-ui,sans-serif;padding-inline:16px;padding-block:24px 40px}
.app{max-width:1240px;margin:0 auto}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.eyebrow{margin:0 0 4px;font-weight:900;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-2)}
.lede{margin:8px 0 0;max-width:60ch;color:var(--ink-2)}

/* ---------- Menu inicial ---------- */
.hub{display:grid;gap:22px}
.hub h1{margin:0;font:800 clamp(38px,7vw,64px)/.95 "Baloo 2","Nunito",system-ui,sans-serif;letter-spacing:-.01em;text-wrap:balance}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.gcard{display:grid;grid-template-columns:76px minmax(0,1fr);gap:14px;align-items:center;padding:14px;border-radius:16px;background:var(--panel);border:1px solid var(--line);color:inherit;text-decoration:none;transition:transform .15s,border-color .15s,box-shadow .15s}
.gcard:hover{transform:translateY(-2px);border-color:var(--ink-2);box-shadow:0 14px 30px -22px rgba(15,40,35,.6)}
.gcard:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.gi{width:76px;height:76px;border-radius:14px;background:var(--ico-bg);display:grid;place-items:center;overflow:hidden}
.gi svg{width:64px;height:64px;display:block}
.gcard h3{margin:0;font:800 21px/1.1 "Baloo 2","Nunito",sans-serif}
.gcard p{margin:3px 0 8px;font-size:14px;line-height:1.35;color:var(--ink-2)}
.prog{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:800;color:var(--ink-2);font-variant-numeric:tabular-nums}
.prog i{width:18px;height:6px;border-radius:3px;background:var(--line)}
.prog i.on{background:var(--ok)}
.prog span{margin-left:4px}

/* ---------- Tela de jogo ---------- */
.gv{display:grid;gap:18px}
.gv-head{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:flex-end;justify-content:space-between}
.back{display:inline-flex;align-items:center;gap:6px;margin-bottom:8px;padding:4px 10px 4px 6px;border-radius:999px;font-weight:800;font-size:14px;color:var(--ink-2);text-decoration:none;border:1px solid var(--line);background:var(--panel)}
.back:hover{color:var(--ink);border-color:var(--ink-2)}
.back:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.gv-title{display:flex;gap:14px;align-items:center}
.gv-title .gi{width:64px;height:64px;flex:none}
.gv-title .gi svg{width:54px;height:54px}
.gv-title h1{margin:0;font:800 clamp(30px,5.4vw,50px)/.95 "Baloo 2","Nunito",system-ui,sans-serif;letter-spacing:-.01em;text-wrap:balance}
.gv-title p{margin:6px 0 0;color:var(--ink-2);max-width:56ch}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:0}
.stats div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 14px 6px;min-width:96px}
.stats dt{font-size:12px;font-weight:800;color:var(--ink-2)}
.stats dd{margin:0;font:800 28px/1.05 "Baloo 2","Nunito",sans-serif;font-variant-numeric:tabular-nums}
.main{display:grid;gap:20px}
@media (min-width:1100px){.main{grid-template-columns:minmax(0,1fr) 300px;align-items:start}}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:0 18px 40px -28px rgba(15,40,35,.55);min-width:0}

/* níveis */
.levels{display:grid;grid-template-columns:repeat(var(--nlv,4),minmax(0,1fr));gap:6px;padding:10px;border-bottom:1px solid var(--line)}
.lvl{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0;padding:8px 12px 9px;border-radius:12px;border:1px solid var(--line);background:var(--page);color:var(--ink);font:inherit;text-align:left;cursor:pointer;transition:border-color .15s,background .15s,color .15s}
.lvl:hover{border-color:var(--ink-2)}
.lvl:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.lvl[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--page)}
.lvl:disabled{cursor:wait}
.lvl.lvl-extra:not([aria-pressed="true"]){border-color:color-mix(in srgb,var(--accent-2) 55%,var(--line))}
.lvl.lvl-extra:not([aria-pressed="true"]) .n{color:var(--accent-2)}
.lvl .n{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font:800 17px/1.1 "Baloo 2","Nunito",sans-serif}
.lvl .s{font-size:12px;font-weight:700;opacity:.72;font-variant-numeric:tabular-nums}
.lvl .ok{padding:2px 7px 1px;border-radius:999px;background:var(--ok);color:#fff;font:900 11px/1.3 "Nunito",sans-serif;font-variant-numeric:tabular-nums}

/* tabuleiro: cada jogo desenha o seu aqui dentro */
.board{position:relative;min-height:300px;padding:18px;background:var(--board);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;touch-action:manipulation;user-select:none;-webkit-user-select:none;overflow:hidden}

/* barra de mensagens e ações */
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 16px;padding:14px 16px;border-top:1px solid var(--line);transition:background .25s}
.bar.fail{background:var(--danger-bg)} .bar.won{background:var(--ok-bg)}
.msg{flex:1 1 300px;min-height:46px;display:flex;flex-direction:column;justify-content:center;gap:1px}
.msg .t{font:700 18px/1.2 "Baloo 2","Nunito",sans-serif}
.msg .d{font-size:15px;color:var(--ink-2);text-wrap:pretty}
.msg.warn .t{color:var(--accent)}
.bar.fail .msg .t{color:var(--danger)} .bar.won .msg .t{color:var(--ok)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{height:44px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:800 15px/1 "Nunito",sans-serif;cursor:pointer;text-decoration:none;transition:border-color .15s,filter .15s,opacity .15s}
.btn:hover{border-color:var(--ink-2)}
.btn:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-size:16px;padding:0 20px}
.btn.primary:hover{filter:brightness(1.06)}
.btn[aria-disabled="true"]{opacity:.5}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.nope{animation:kit-nope .38s ease-in-out}
.arrow{font-size:18px;line-height:1}

/* regras */
.rules{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 16px 16px}
.rules h2{margin:0 0 10px 4px;font:800 24px/1.1 "Baloo 2","Nunito",sans-serif}
.rules-sub{margin:-6px 0 10px 4px;font-size:14px;font-weight:700;color:var(--ink-2)}
.rules ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.rules li{display:grid;grid-template-columns:42px 1fr;gap:12px;align-items:center;padding:8px;border-radius:12px;border:1px solid transparent;font-size:15px;line-height:1.35;transition:background .25s,border-color .25s}
.rules li.noicon{grid-template-columns:1fr}
.rules li b{font-weight:800}
.ico{width:42px;height:42px;border-radius:11px;background:var(--ico-bg);display:grid;place-items:center;overflow:hidden;color:var(--ink)}
.ico svg{width:34px;height:34px}
.rules li.broken{background:var(--danger-bg);border-color:var(--danger)}
.rules li.flash{animation:kit-flash 1.1s ease-out}
.how{margin:14px 4px 0;font-size:14px;color:var(--ink-2)}
.how b{color:var(--ink)}
.new{display:inline-block;margin-left:4px;padding:1px 7px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font:900 10px/1.6 "Nunito",sans-serif;letter-spacing:.06em;text-transform:uppercase;vertical-align:1px}

@keyframes kit-nope{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
@keyframes kit-flash{0%,40%{background:color-mix(in srgb,var(--hint) 40%,transparent)}}
@keyframes kit-pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}

@media (max-width:560px){
  body{padding-block:16px 32px}
  .stats{width:100%}
  .stats div{min-width:0;flex:1;padding:6px 10px 4px}
  .stats dd{font-size:24px}
  .levels{grid-template-columns:repeat(2,minmax(0,1fr))}
  .levels .lvl:last-child:nth-child(odd){grid-column:1/-1}
  .lvl{padding:7px 10px 8px}
  .lvl .n{font-size:15px}
  .lvl .cnt{display:none}
  .board{padding:12px}
  .actions{width:100%}
  .actions .btn{flex:1 1 30%;padding:0 10px}
  .actions .btn.primary{flex-basis:100%;order:-1}
  .actions.duo .btn.primary{flex-basis:calc(50% - 4px)}
  .gv-title .gi{display:none}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

</style>

<div class="app"><main id="view"></main></div>

<script>
/* Jogos de lógica do Danilo — utilidades puras (funcionam no navegador e no Node, para testes) */
const JogosCore = (() => {
  // Gerador pseudoaleatório com semente (mulberry32): mesma semente, mesmo desafio.
  function rng(seed) {
    let a = seed >>> 0;
    const next = () => {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    next.int = n => Math.floor(next() * n);                      // 0 .. n-1
    next.range = (lo, hi) => lo + Math.floor(next() * (hi - lo + 1)); // lo .. hi
    next.pick = arr => arr[Math.floor(next() * arr.length)];
    next.shuffle = arr => {
      const r = arr.slice();
      for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(next() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; }
      return r;
    };
    return next;
  }
  const newSeed = () => (Math.random() * 4294967296) >>> 0;

  // Busca em largura: menor sequência de movimentos até um estado objetivo.
  // opts.key(estado) → string única; opts.next(estado) → [{ move, state }]; opts.goal(estado) → bool.
  // Devolve { path: [movimentos], states: [estados, do início ao fim] } ou null.
  function bfs(start, { key, next, goal, limit = 1e6 }) {
    const build = n => {
      const path = [], states = [];
      for (let x = n; x; x = x.parent) { states.unshift(x.state); if (x.parent) path.unshift(x.move); }
      return { path, states };
    };
    const root = { state: start, parent: null, move: null };
    if (goal(start)) return build(root);
    const seen = new Set([key(start)]);
    let frontier = [root];
    while (frontier.length) {
      const nf = [];
      for (const n of frontier) {
        for (const { move, state } of next(n.state)) {
          const k = key(state);
          if (seen.has(k)) continue;
          seen.add(k);
          const m = { state, parent: n, move };
          if (goal(state)) return build(m);
          if (seen.size > limit) return null;
          nf.push(m);
        }
      }
      frontier = nf;
    }
    return null;
  }

  // Distância (em movimentos) de todos os estados alcançáveis a partir de `start`.
  function bfsAll(start, { key, next, limit = 2e6 }) {
    const dist = new Map([[key(start), 0]]);
    let frontier = [start], d = 0;
    while (frontier.length && dist.size <= limit) {
      const nf = [];
      d++;
      for (const s of frontier) {
        for (const { state } of next(s)) {
          const k = key(state);
          if (dist.has(k)) continue;
          dist.set(k, d);
          nf.push(state);
        }
      }
      frontier = nf;
    }
    return dist;
  }

  const fmtTime = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  const plural = (n, um, varios) => `${n} ${n === 1 ? um : varios}`;

  return { rng, newSeed, bfs, bfsAll, fmtTime, plural };
})();
if (typeof module !== 'undefined' && module.exports) module.exports = JogosCore;

/* Jogos de lógica do Danilo — kit compartilhado: menu, tela de jogo, níveis, recordes e barra de ações.
   Cada jogo se registra com Jogos.register({...}) — veja src/COMO-CRIAR-UM-JOGO.md. */
const Jogos = (() => {
  const NOME = 'Jogos de lógica do Danilo';   // nome da coleção (menu e título da aba)
  const INK = '#2A2433';
  const OL = `stroke="${INK}" stroke-width="1.6" stroke-linejoin="round"`;
  // Cores de peças (iguais nos dois temas; sempre com contorno INK). sym ajuda quem não distingue cores.
  const PIECES = [
    { id: 'vermelho', fill: '#E5484D', sym: '●' }, { id: 'laranja', fill: '#F08A24', sym: '▲' },
    { id: 'amarelo', fill: '#F2C230', sym: '■' }, { id: 'verde', fill: '#3FA66B', sym: '◆' },
    { id: 'azul', fill: '#3E7BD9', sym: '★' }, { id: 'roxo', fill: '#8B5CD6', sym: '✚' },
    { id: 'rosa', fill: '#E86FA4', sym: '♥' }, { id: 'turquesa', fill: '#2BA3A3', sym: '⬟' },
  ];
  const games = [];
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');

  /* ---------- utilidades de DOM ---------- */
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else if (k === 'html') el.innerHTML = v;
      else if (k === 'style' && typeof v === 'object') for (const [p, val] of Object.entries(v)) { if (p.startsWith('--')) el.style.setProperty(p, val); else el.style[p] = val; }
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const c of kids.flat(Infinity)) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(String(c)));
    return el;
  }
  function svg(tag, attrs, ...kids) {
    const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else if (k === 'html') el.innerHTML = v;
      else el.setAttribute(k, v);
    }
    for (const c of kids.flat(Infinity)) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(String(c)));
    return el;
  }
  const retrigger = (el, cls = 'nope', ms = 420) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); setTimeout(() => el.classList.remove(cls), ms); };

  /* ---------- recordes (por jogo e nível; menor é melhor) ---------- */
  const store = {
    get(k) { try { return localStorage.getItem('jogos-logica:' + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem('jogos-logica:' + k, String(v)); } catch (e) {} },
  };
  const memBest = {};
  const best = {
    get(g, l) { const k = g + ':' + l; if (k in memBest) return memBest[k]; const v = parseFloat(store.get('recorde:' + k)); return v >= 0 ? v : null; },
    set(g, l, v) { const cur = best.get(g, l); if (cur != null && cur <= v) return false; memBest[g + ':' + l] = v; store.set('recorde:' + g + ':' + l, v); return true; },
  };

  const memDone = {};
  const markDone = (g, l) => { memDone[g + ':' + l] = true; store.set('feito:' + g + ':' + l, 1); };
  const isDone = (g, l) => !!memDone[g + ':' + l] || store.get('feito:' + g + ':' + l) === '1' || best.get(g, l) != null;

  function register(def) {
    if (!def || !def.id || !def.levels || !def.mount) throw new Error('Jogo inválido: precisa de id, levels e mount');
    def.metric = Object.assign({ label: 'Movimentos', unit: ['movimento', 'movimentos'], format: 'count' }, def.metric);
    if (def.css) document.head.append(h('style', { 'data-jogo': def.id }, def.css));
    games.push(def);
  }
  const fmt = (g, v) => (v == null ? '—' : g.metric.format === 'time' ? JogosCore.fmtTime(v) : String(v));

  /* ---------- rotas: #id-do-jogo abre o jogo; vazio abre o menu ---------- */
  const view = () => document.getElementById('view');
  let cur = null;          // sessão do nível em andamento
  let ui = null;           // elementos da tela de jogo
  let cleanups = [];       // o que desligar ao sair do nível
  let warnTimer = 0;

  function route() {
    const id = decodeURIComponent(location.hash.slice(1));
    const g = games.find(x => x.id === id);
    if (g) openGame(g); else openHome();
  }
  // Abre a tela direto e só depois tenta atualizar o endereço: funciona mesmo onde mudar o # é bloqueado.
  function go(id) {
    const g = games.find(x => x.id === id);
    if (g) openGame(g); else openHome();
    try {
      if (g) history.pushState(null, '', '#' + id);
      else if (location.hash) history.pushState(null, '', location.pathname + location.search);
    } catch (e) { /* endereço fixo neste ambiente */ }
  }
  function start() {
    window.addEventListener('hashchange', route);
    window.addEventListener('popstate', route);
    document.addEventListener('click', e => {
      const a = e.target.closest && e.target.closest('a[data-go]');
      if (!a || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey) return;
      e.preventDefault();
      go(a.dataset.go);
    });
    route();
  }

  function teardown() {
    clearTimeout(warnTimer);
    if (cur && cur.ctrl && cur.ctrl.destroy) { try { cur.ctrl.destroy(); } catch (e) { console.error(e); } }
    cleanups.forEach(f => { try { f(); } catch (e) {} });
    cleanups = [];
    cur = null;
  }

  /* ---------- menu inicial ---------- */
  function openHome() {
    teardown();
    ui = null;
    document.title = NOME;
    const won = games.reduce((n, g) => n + g.levels.filter(l => isDone(g.id, l.id)).length, 0);
    const total = games.reduce((n, g) => n + g.levels.length, 0);
    // Níveis além dos quatro de sempre (ex.: o NG+ da Travessia) ganham uma menção no menu
    const extraTxt = games.filter(g => g.levels.length > 4).map(g => {
      const names = g.levels.slice(4).map(l => l.name);
      return `, e a ${g.name} tem ainda ${names.length > 1 ? `os níveis ${names.slice(0, -1).join(', ')} e ${names[names.length - 1]}` : `o nível ${names[0]}`}`;
    }).join('');
    view().replaceChildren(h('section', { class: 'hub' },
      h('header', {},
        h('p', { class: 'eyebrow' }, 'Raciocínio lógico'),
        h('h1', {}, NOME),
        h('p', { class: 'lede' }, `${games.length} jogos, cada um com quatro níveis de dificuldade${extraTxt}. ` +
          (won ? `Você já venceu ${won} de ${total} níveis.` : 'Escolha um para começar; o Fácil de cada jogo é um bom aquecimento.'))),
      h('div', { class: 'cards' }, games.map(cardFor))));
    window.scrollTo(0, 0);
  }
  function cardFor(g) {
    const done = g.levels.map(l => isDone(g.id, l.id));
    const n = done.filter(Boolean).length;
    return h('a', { class: 'gcard', href: '#' + g.id, 'data-go': g.id },
      h('span', { class: 'gi', html: g.icon || '' }),
      h('span', {},
        h('h3', {}, g.name),
        h('p', {}, g.tagline),
        h('span', { class: 'prog', 'aria-label': `${n} de ${g.levels.length} níveis vencidos` },
          done.map(d => h('i', { class: d ? 'on' : '' })), h('span', { 'aria-hidden': 'true' }, `${n}/${g.levels.length}`))));
  }

  /* ---------- tela de jogo ---------- */
  function openGame(g) {
    teardown();
    document.title = `${g.name} · ${NOME}`;
    const saved = parseInt(store.get('nivel:' + g.id), 10);
    buildGameView(g);
    startLevel(g, g.levels[saved] ? saved : 0);
    window.scrollTo(0, 0);
  }

  function buildGameView(g) {
    const u = {};
    u.moves = h('dd', {}, '0');
    u.minLabel = h('dt', {}, 'Mínimo possível');
    u.min = h('dd', {}, '—');
    u.minBox = h('div', {}, u.minLabel, u.min);
    u.best = h('dd', {}, '—');
    u.levels = h('nav', { class: 'levels', 'aria-label': 'Nível de dificuldade' });
    u.board = h('div', { class: 'board' });
    u.msg = h('div', { class: 'msg', role: 'status', 'aria-live': 'polite' });
    u.btnHint = h('button', { type: 'button', class: 'btn', onclick: () => act('onHint') }, 'Dica');
    u.btnUndo = h('button', { type: 'button', class: 'btn', onclick: onUndo }, 'Desfazer');
    u.btnReset = h('button', { type: 'button', class: 'btn', onclick: onReset }, 'Recomeçar');
    u.btnNew = h('button', { type: 'button', class: 'btn', onclick: () => cur && startLevel(cur.g, cur.li) }, 'Novo desafio');
    u.btnNext = h('button', { type: 'button', class: 'btn primary', onclick: () => cur && startLevel(cur.g, cur.li + 1) }, 'Próximo nível ', h('span', { class: 'arrow', 'aria-hidden': 'true' }, '→'));
    u.primaryLabel = h('span', {});
    u.btnPrimary = h('button', { type: 'button', class: 'btn primary', onclick: () => act('onPrimary') }, u.primaryLabel);
    // Segundo botão de ação, à esquerda do principal (ex.: na ilha da Travessia, "voltar" ao lado de "seguir")
    u.altLabel = h('span', {});
    u.btnAlt = h('button', { type: 'button', class: 'btn primary', onclick: () => act('onAlt') }, u.altLabel);
    u.actions = h('div', { class: 'actions' }, u.btnHint, u.btnUndo, u.btnReset, u.btnNew, u.btnNext, u.btnAlt, u.btnPrimary);
    u.bar = h('div', { class: 'bar' }, u.msg, u.actions);
    u.rulesSub = h('p', { class: 'rules-sub' });
    u.rules = h('ul', {});
    u.how = h('p', { class: 'how' });
    view().replaceChildren(h('section', { class: 'gv' },
      h('div', { class: 'gv-head' },
        h('div', {},
          h('a', { class: 'back', href: '#', 'data-go': '' }, h('span', { 'aria-hidden': 'true' }, '←'), 'Todos os jogos'),
          h('div', { class: 'gv-title' }, h('span', { class: 'gi', html: g.icon || '' }),
            h('div', {}, h('h1', {}, g.name), h('p', {}, g.tagline)))),
        h('dl', { class: 'stats' },
          h('div', {}, h('dt', {}, g.metric.label), u.moves), u.minBox, h('div', {}, h('dt', {}, 'Seu recorde'), u.best))),
      h('div', { class: 'main' },
        h('section', { class: 'stage', 'aria-label': g.name }, u.levels, u.board, u.bar),
        h('aside', { class: 'rules', 'aria-label': 'Regras' }, h('h2', {}, 'Regras'), u.rulesSub, u.rules, u.how))));
    u.levels.addEventListener('click', e => {
      const b = e.target.closest('.lvl');
      if (b && cur && !cur.busy) startLevel(cur.g, +b.dataset.i);
    });
    ui = u;
  }

  function act(name) {
    const s = cur;
    if (!s || s.busy || !s.ctrl || !s.ctrl[name]) return;
    if ((name === 'onPrimary' || name === 'onAlt') && (s.status !== 'play')) return;
    if (name === 'onHint' && s.status !== 'play') return;
    s.ctrl[name]();
  }
  function onUndo() {
    const s = cur;
    if (!s || s.busy || !s.ctrl || !s.ctrl.onUndo || s.status === 'won') return;
    if (s.status === 'fail' && s.failInfo && s.failInfo.final) return;   // essa derrota só se resolve recomeçando
    if (s.status === 'fail') { s.status = 'play'; s.failInfo = null; }
    s.ctrl.onUndo();
    refresh();
  }
  function onReset() {
    const s = cur;
    if (!s || s.busy) return;
    if (s.status === 'won' || s.g.freshRestart) return startLevel(s.g, s.li);   // novo desafio do mesmo nível
    startLevel(s.g, s.li, s.seed);                                   // mesmo desafio, do começo
  }

  function startLevel(g, li, seed) {
    if (!g.levels[li]) return;
    if (cur && cur.ctrl && cur.ctrl.destroy) { try { cur.ctrl.destroy(); } catch (e) { console.error(e); } }
    cleanups.forEach(f => { try { f(); } catch (e) {} });
    cleanups = [];
    clearTimeout(warnTimer);
    store.set('nivel:' + g.id, li);
    const level = g.levels[li];
    const s = cur = {
      g, li, level, seed: seed ?? JogosCore.newSeed(), status: 'play', moves: 0, min: null, minLabel: null,
      base: null, warnMsg: null, hintMsg: null, busy: false, ctrl: null, primaryCfg: null, altCfg: null,
      controls: { hint: true, undo: false }, hintsUsed: 0, failInfo: null, winInfo: null, newRecord: false,
    };
    ui.board.replaceChildren();
    ui.board.className = `board board-${g.id}`;
    ui.board.removeAttribute('style');
    renderLevels();
    renderRules();
    const ctx = makeCtx(s);
    try { s.ctrl = g.mount(ctx) || {}; }
    catch (e) { console.error(e); s.ctrl = {}; s.base = { t: 'Algo deu errado', d: 'Não foi possível montar este nível. Tente recomeçar.' }; }
    refresh();
  }

  function makeCtx(s) {
    const alive = () => cur === s;
    const ctx = {
      game: s.g, level: s.level, levelIndex: s.li, seed: s.seed, board: ui.board,
      rng: JogosCore.rng(s.seed), INK, OL, PIECES, h, svg, retrigger, core: JogosCore,
      get reduced() { return reduce.matches; },
      get status() { return s.status; },
      say(t, d) { if (!alive()) return; s.base = { t, d }; refreshBar(); },
      warn(t, d, rule) {
        if (!alive()) return;
        s.warnMsg = { t, d };
        s.warnAt = performance.now();
        clearTimeout(warnTimer);
        warnTimer = setTimeout(() => { if (alive()) { s.warnMsg = null; refreshBar(); } }, 3400);
        if (rule != null) flashRule(rule);
        refreshBar();
      },
      hint(t, d) { if (!alive()) return; s.hintMsg = { t: t || 'Dica', d }; s.hintsUsed++; s.warnMsg = null; refreshBar(); },
      clearHint() { if (!alive()) return; s.hintMsg = null; refreshBar(); },
      clearWarn() { if (!alive()) return; s.warnMsg = null; clearTimeout(warnTimer); refreshBar(); },
      // Um movimento novo apaga a dica anterior (no formato tempo, o relógio não conta como jogada)
      setMoves(n) {
        if (!alive()) return;
        if (s.g.metric.format !== 'time' && n !== s.moves) {
          let changed = false;
          if (s.hintMsg) { s.hintMsg = null; changed = true; }
          if (s.warnMsg && performance.now() - (s.warnAt || 0) > 250) { s.warnMsg = null; clearTimeout(warnTimer); changed = true; }
          if (changed) refreshBar();
        }
        s.moves = n; refreshStats();
      },
      setMin(n, label) { if (!alive()) return; s.min = n; s.minLabel = label || null; refreshStats(); },
      controls(o) { if (!alive()) return; Object.assign(s.controls, o); refreshBar(); },
      primary(label, opts) { if (!alive()) return; s.primaryCfg = label ? Object.assign({ label }, opts) : null; refreshBar(); },
      alt(label, opts) { if (!alive()) return; s.altCfg = label ? Object.assign({ label }, opts) : null; refreshBar(); },
      busy(b) { if (!alive()) return; s.busy = !!b; refreshBar(); },
      win(o = {}) {
        if (!alive() || s.status === 'won') return;
        s.status = 'won'; s.winInfo = o; s.hintMsg = null; s.warnMsg = null;
        markDone(s.g.id, s.level.id);
        s.newRecord = s.hintsUsed ? false : best.set(s.g.id, s.level.id, o.score ?? s.moves);
        renderLevels(); refresh();
      },
      fail(o = {}) {
        if (!alive()) return;
        s.status = 'fail'; s.failInfo = o; s.hintMsg = null; s.warnMsg = null;
        refresh();
      },
      resume() { if (!alive()) return; s.status = 'play'; s.failInfo = null; refresh(); },
      flashRule,
      // Ciclo de vida: tudo que for registrado aqui é desligado ao trocar de nível ou sair do jogo.
      later(fn, ms) { const id = setTimeout(() => { if (alive()) fn(); }, ms); cleanups.push(() => clearTimeout(id)); return id; },
      every(fn, ms) { const id = setInterval(() => { if (alive()) fn(); }, ms); cleanups.push(() => clearInterval(id)); return id; },
      listen(target, type, fn, opts) { target.addEventListener(type, fn, opts); cleanups.push(() => target.removeEventListener(type, fn, opts)); },
      onResize(fn) {
        let last = -1, raf = 0;
        // O redesenho vai para o quadro seguinte: evita o aviso "ResizeObserver loop" quando o jogo muda a altura do tabuleiro.
        const ro = new ResizeObserver(() => {
          cancelAnimationFrame(raf);
          raf = requestAnimationFrame(() => { const w = ui.board.clientWidth; if (w && w !== last && alive()) { last = w; fn(w); } });
        });
        ro.observe(ui.board);
        cleanups.push(() => { ro.disconnect(); cancelAnimationFrame(raf); });
      },
      bestFor(levelId) { return best.get(s.g.id, levelId ?? s.level.id); },
    };
    return ctx;
  }

  function flashRule(key) {
    if (!ui) return;
    const li = ui.rules.querySelector(`li[data-rule="${key}"]`);
    if (li) retrigger(li, 'flash', 1200);
  }

  function renderLevels() {
    const s = cur, g = s.g;
    ui.levels.style.setProperty('--nlv', g.levels.length);
    ui.levels.replaceChildren(...g.levels.map((l, i) => {
      const b = best.get(g.id, l.id);
      return h('button', { type: 'button', class: 'lvl' + (l.extra ? ' lvl-extra' : ''), 'data-i': i, 'aria-pressed': String(i === s.li) },
        h('span', { class: 'n' }, l.name || ['Fácil', 'Médio', 'Difícil', 'Muito difícil'][i],
          b != null ? h('span', { class: 'ok', title: 'Seu recorde' }, '✓ ' + fmt(g, b)) : isDone(g.id, l.id) ? h('span', { class: 'ok', title: 'Vencido com dicas' }, '✓') : null),
        l.sub ? h('span', { class: 's', html: l.sub }) : null);
    }));
  }

  function renderRules() {
    const s = cur, g = s.g;
    const items = g.rules ? g.rules(s.level) : [];
    ui.rules.replaceChildren(...items.map(r => h('li', { 'data-rule': r.key || '', class: r.icon ? '' : 'noicon' },
      r.icon ? h('span', { class: 'ico', html: r.icon }) : null,
      h('span', { html: r.html + (r.novo ? '<span class="new">Novo</span>' : '') }))));
    ui.rulesSub.textContent = s.level.blurb ? `${s.level.name}: ${s.level.blurb}` : '';
    ui.rulesSub.hidden = !s.level.blurb;
    const how = typeof g.how === 'function' ? g.how(s.level) : g.how;
    ui.how.innerHTML = how || '';
    ui.how.hidden = !how;
  }

  function refresh() { refreshStats(); refreshBar(); }
  function refreshStats() {
    const s = cur; if (!s || !ui) return;
    ui.moves.textContent = fmt(s.g, s.moves);
    ui.minBox.hidden = s.min == null;
    ui.min.textContent = s.min ?? '—';
    ui.minLabel.textContent = s.minLabel || 'Mínimo possível';
    ui.best.textContent = fmt(s.g, best.get(s.g.id, s.level.id));
  }

  function winMsg(s) {
    const o = s.winInfo || {}, g = s.g;
    const val = o.score ?? s.moves;
    const perfect = o.perfect ?? (s.min != null && val <= s.min);
    const words = g.metric.format === 'time' ? `em ${JogosCore.fmtTime(val)}` : `em ${JogosCore.plural(val, g.metric.unit[0], g.metric.unit[1])}`;
    let d = o.text || (`Você terminou ${words}` + (s.min != null && g.metric.format !== 'time' ? (perfect ? ', o mínimo possível.' : `. O mínimo é ${s.min}.`) : '.'));
    if (s.newRecord) d += ' Novo recorde!';
    if (s.hintsUsed) d += ` Você usou ${JogosCore.plural(s.hintsUsed, 'dica', 'dicas')}, então esta partida não conta como recorde.`;
    const next = g.levels[s.li + 1];
    if (next) d += ` Próximo: ${next.name}.`;
    return { t: o.title || (perfect ? 'Perfeito!' : 'Resolvido!'), d };
  }

  function refreshBar() {
    const s = cur; if (!s || !ui) return;
    const c = s.ctrl || {}, won = s.status === 'won', fail = s.status === 'fail';
    const final = fail && !!(s.failInfo && s.failInfo.final);   // derrota que não se desfaz: só recomeçar do início
    ui.bar.classList.toggle('won', won);
    ui.bar.classList.toggle('fail', fail);
    ui.btnHint.hidden = !c.onHint || won || fail;
    ui.btnHint.disabled = s.busy || s.controls.hint === false;
    ui.btnUndo.hidden = !c.onUndo || won || final;
    ui.btnUndo.disabled = s.busy || (!fail && !s.controls.undo);
    ui.btnUndo.textContent = fail ? 'Desfazer jogada' : 'Desfazer';
    ui.btnUndo.classList.toggle('primary', fail && !!c.onUndo);
    ui.btnReset.textContent = won ? 'Jogar de novo' : final ? 'Recomeçar do início' : 'Recomeçar';
    ui.btnReset.disabled = s.busy;
    ui.btnNew.hidden = !s.g.generated || won;
    ui.btnNew.disabled = s.busy;
    const next = s.g.levels[s.li + 1];
    ui.btnNext.hidden = !won || !next;
    ui.btnReset.classList.toggle('primary', (won && !next) || final);
    ui.btnPrimary.hidden = !s.primaryCfg || won || fail;
    if (s.primaryCfg) {
      ui.primaryLabel.innerHTML = s.primaryCfg.label;
      ui.btnPrimary.setAttribute('aria-disabled', String(!!s.primaryCfg.disabled || s.busy));
    }
    ui.btnAlt.hidden = !s.altCfg || won || fail;
    if (s.altCfg) {
      ui.altLabel.innerHTML = s.altCfg.label;
      ui.btnAlt.setAttribute('aria-disabled', String(!!s.altCfg.disabled || s.busy));
    }
    ui.actions.classList.toggle('duo', !ui.btnAlt.hidden && !ui.btnPrimary.hidden);
    ui.levels.querySelectorAll('.lvl').forEach(b => { b.disabled = s.busy; });
    ui.rules.querySelectorAll('li').forEach(li => li.classList.toggle('broken', fail && !!s.failInfo && s.failInfo.rule != null && li.dataset.rule === String(s.failInfo.rule)));
    let m, cls = '';
    if (won) m = winMsg(s);
    else if (fail) m = { t: s.failInfo.title || 'Regra quebrada!', d: s.failInfo.text };
    else if (s.warnMsg) { m = s.warnMsg; cls = 'warn'; }
    else if (s.hintMsg) { m = s.hintMsg; cls = 'hint'; }
    else m = s.base || { t: '', d: '' };
    ui.msg.className = 'msg ' + cls;
    ui.msg.innerHTML = `<span class="t">${m.t || ''}</span>${m.d ? `<span class="d">${m.d}</span>` : ''}`;
  }

  return { register, start, go, h, svg, retrigger, INK, OL, PIECES, core: JogosCore, games };
})();

/* ---------- Ilustrações ---------- */
const INK = '#2A2433';

/* Rotas da jangada: sem ilha, de uma margem direto para a outra; com ilha, ela sempre para na ilha */
const ROUTES = l => (l.ilha ? { A: ['I'], I: ['A', 'B'], B: ['I'] } : { A: ['B'], B: ['A'] });

/* Busca em largura por papéis: quem tem o mesmo papel é intercambiável, então o estado é só quantos de cada papel

const ROLES = ['pai', 'mae', 'pol', 'lad', 'filho', 'filha', 'cao'];
function solve(l, where, raft) {
  const byRole = ROLES.map(r => l.ids.filter(id => CAST[id].role === r));
  const total = byRole.map(ids => ids.length), R = ROLES.length;
  const at = p => byRole.map(ids => ids.filter(id => where[id] === p).length);
  const sum = c => c.reduce((x, y) => x + y, 0);
  const memo = new Map();
  const ok = c => {   // nenhuma regra quebrada num lugar com estas quantidades
    const k = c.join('');
    if (!memo.has(k)) memo.set(k, !check(byRole.flatMap((ids, i) => ids.slice(0, c[i])), 'X'));
    return memo.get(k);

  if (!sum(a0) && !sum(i0)) return [];
  const prev = new Map([[key(a0, i0, raft), null]]);
  let frontier = [[a0, i0, raft]];
  while (frontier.length) {
    const next = [];
    for (const [a, i, r] of frontier) {
      const here = r === 'A' ? a : r === 'I' ? i : total.map((t, k) => t - a[k] - i[k]);
      const groups = [];   // grupos de 1 ou 2 com quem está onde a jangada está

      for (const g of groups) {
        if (!ok(g)) continue;   // regra quebrada dentro da jangada

function layout() {

      const step = g.th + 4, front = g.raftFeet - g.ah - g.th - 4, s = g.cw * 0.62;
      g.islot = Array.from({ length: isl.cap }, (_, j) => ({ x: W / 2 + (j - (isl.cap - 1) / 2) * s, feet: front - (j % 2 ? 0 : step) }));

// Posição da jangada: parada em A, I ou B, ou no meio de um trecho ("A>I") quando uma regra é quebrada a bordo
function raftPos(at) {
  if (at.includes('>')) {
    const [p, q] = at.split('>').map(raftPos);
    return { x: (p.x + q.x) / 2, y: (p.y + q.y) / 2, feet: (p.feet + q.feet) / 2 };
  }
  let x, feet;
  if (!G.vert) {
    feet = G.raftFeet;
    x = at === 'A' ? G.bankW - 0.1 * G.rw : at === 'B' ? G.W - G.bankW - 0.9 * G.rw : G.W / 2 - G.rw / 2;
  } else {
    x = G.raftX ?? G.W / 2 - G.rw / 2;
    feet = at === 'A' ? G.raftFeetA : at === 'B' ? G.raftFeetB : G.raftFeetI;
  }
  return { x, y: feet - G.rh * RAFT_FEET, feet };

  let s = `<defs>${isl && isl.correnteza ? rapid : ''}
    <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="s-sky1"/><stop offset="1" class="s-sky2"/></linearGradient>
    <linearGradient id="gGrass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="s-g1"/><stop offset="1" class="s-g2"/></linearGradient>
    <linearGradient id="gWater" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="s-w1"/><stop offset="1" class="s-w2"/></linearGradient>
    <pattern id="pWave" width="48" height="28" patternUnits="userSpaceOnUse"><path class="w" d="M4 8 q5 -4 10 0 t10 0"/><path class="w" d="M28 21 q4 -3 8 0 t8 0"/>${anim}</pattern>
  </defs>`;
  s += `<rect width="${W}" height="${hz + 2}" fill="url(#gSky)"/>`;
  s += `<g class="stars" fill="#FFFFFF">` + Array.from({ length: 16 }, () => `<circle cx="${(R() * W).toFixed(1)}" cy="${(R() * hz * 0.7).toFixed(1)}" r="${(0.6 + R() * 1.1).toFixed(1)}"/>`).join('') + `</g>`;
  const mx = W * (vert ? 0.86 : 0.9), my = hz * 0.4, mr = Math.min(hz * 0.17, 16);
  s += `<circle class="sun" cx="${mx}" cy="${my}" r="${mr}" fill="#FFD45C"/>`;
  s += `<path class="moon" d="M${mx} ${my - mr} A${mr} ${mr} 0 1 0 ${mx} ${my + mr} A${mr * 0.62} ${mr} 0 1 1 ${mx} ${my - mr} Z" fill="#F4F1DA"/>`;
  s += cloud(W * 0.22, hz * 0.34, vert ? 0.6 : 0.9, 'c1') + cloud(W * 0.58, hz * 0.22, vert ? 0.45 : 0.7, 'c2');
  const a = hz * (vert ? 0.5 : 0.42);
  s += `<path class="f-hill1" d="M0 ${hz} L0 ${hz - a * .5} C${W * .1} ${hz - a * .9} ${W * .2} ${hz - a} ${W * .32} ${hz - a * .45} C${W * .42} ${hz - a * .1} ${W * .5} ${hz - a * .8} ${W * .62} ${hz - a * .7} C${W * .74} ${hz - a * .6} ${W * .84} ${hz - a * 1.05} ${W} ${hz - a * .55} L${W} ${hz} Z"/>`;
  s += `<path class="f-hill2" d="M0 ${hz} L0 ${hz - a * .25} C${W * .15} ${hz - a * .5} ${W * .28} ${hz - a * .1} ${W * .4} ${hz - a * .3} C${W * .55} ${hz - a * .55} ${W * .7} ${hz - a * .12} ${W * .85} ${hz - a * .35} C${W * .93} ${hz - a * .45} ${W} ${hz - a * .3} ${W} ${hz - a * .3} L${W} ${hz} Z"/>`;
  s += `<rect y="${hz}" width="${W}" height="${H - hz}" fill="url(#gGrass)"/>`;
  // tufos de grama
  s += `<g fill="none" stroke="rgba(30,70,20,.32)" stroke-width="1.6" stroke-linejoin="round">`;
  for (let i = 0; i < (vert ? 16 : 26); i++) {
    const x = R() * W, y = hz + 10 + R() * (H - hz - 16);
    s += `<path d="M${(x - 5).toFixed(1)} ${y.toFixed(1)} l2 -7 l2 7 l2 -9 l2 9 l2 -6 l1 6"/>`;
  }
  s += `</g>`;

  if (!vert) {
    const cx = W / 2, gh = H - hz;
    // Com a ilha, o rio abre menos em perspectiva: precisa caber a ilha já no meio da cena
    const hw = t => G.riverW / 2 * (isl ? 0.66 + 0.44 * t : 0.3 + 0.85 * t);
    const y = t => hz + gh * t;
    const path = e => { const L = t => cx - hw(t) - e * (0.3 + t), Rr = t => cx + hw(t) + e * (0.3 + t);
      return `M${L(0)} ${hz} Q${L(.45) - 10} ${y(.45)} ${L(1.06)} ${y(1.06)} L${Rr(1.06)} ${y(1.06)} Q${Rr(.45) + 10} ${y(.45)} ${Rr(0)} ${hz} Z`; };
    s += tree(G.cw * 0.25, hz + 16, G.ah / 112);
    s += house(cx + hw(0) + 10, hz + 5, G.cw / 90);
    s += `<path class="f-sand" d="${path(7)}"/><path d="${path(0)}" fill="url(#gWater)"/><path d="${path(0)}" fill="url(#pWave)"/>`;
    if (isl) {
      if (isl.correnteza) {
        // metade do rio do lado da chegada, com a borda esfumada
        s += `<linearGradient id="gRapid" gradientUnits="userSpaceOnUse" x1="${cx - 30}" y1="0" x2="${cx + 40}" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff"/></linearGradient>` +
          `<mask id="mRapid"><path d="${path(0)}" fill="url(#gRapid)"/></mask><rect mask="url(#mRapid)" x="0" y="${hz}" width="${W}" height="${gh}" fill="url(#pRapid)"/>`;
        s += `<text class="bl on-water" x="${cx + hw(0.1) * 0.55}" y="${y(0.1) + 4}" text-anchor="middle">CORRENTEZA</text>`;
      }
      s += islet(G.isle, G.ah / 120);
    }
    s += reeds(cx - hw(.5) - 16, y(.5), G.cw / 70) + reeds(cx + hw(.3) + 8, y(.3), G.cw / 80) + reeds(cx + hw(.62) + 10, y(.62), G.cw / 70);
    s += `<text class="bl" x="${G.bankW / 2}" y="${H - 9}" text-anchor="middle">PARTIDA</text>`;
    s += `<text class="bl" x="${W - G.bankW / 2}" y="${H - 9}" text-anchor="middle">CHEGADA</text>`;
  } else {
    const t = G.raftFeetB - 8, b = G.raftFeetA + G.rh * 0.22;
    const band = e => `M0 ${t - e} C${W * .3} ${t - e - 7} ${W * .65} ${t - e + 7} ${W} ${t - e - 3} L${W} ${b + e} C${W * .65} ${b + e + 7} ${W * .3} ${b + e - 7} 0 ${b + e + 3} Z`;
    s += `<path class="f-sand" d="${band(6)}"/><path d="${band(0)}" fill="url(#gWater)"/><path d="${band(0)}" fill="url(#pWave)"/>`;
    if (isl) {
      if (isl.correnteza) {
        // correnteza: da margem de chegada até a altura da ilha
        const yr = (G.raftFeetB + G.raftFeetI) / 2 + 6;
        s += `<linearGradient id="gRapid" gradientUnits="userSpaceOnUse" x1="0" y1="${yr - 28}" x2="0" y2="${yr + 12}"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>` +
          `<mask id="mRapid"><path d="${band(0)}" fill="url(#gRapid)"/></mask><rect mask="url(#mRapid)" x="0" y="${t - 20}" width="${W}" height="${b - t + 40}" fill="url(#pRapid)"/>`;
      }
      s += islet(G.isle, G.ah / 130);
    }
    s += reeds(14, t + 4, G.cw / 90) + reeds(W - 30, b + 2, G.cw / 90);
    s += `<text class="bl" x="${G.pad}" y="15">CHEGADA</text>`;
    s += `<text class="bl" x="${W / 2}" y="${H - 8}" text-anchor="middle">PARTIDA</text>`;
  }
  bg.setAttribute('width', W);
  bg.setAttribute('height', H);
  bg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  bg.innerHTML = s;
}


  /* ---------- Integração com o kit da coleção ---------- */
  let scene, bg, raftEl, tagsEl, ctxRef;
  let reduceMotion = { matches: false };
  let S = null, history = [], status = 'play', raftAt = 'A', failInfo = null, hintIds = [];
  let els = {}, tagEls = {}, islandSeat = {};
  const TIME = () => (reduceMotion.matches ? { walk: 120, cross: 260 } : { walk: 380, cross: 1250 });

  const ICON = `<svg viewBox="0 0 64 64" aria-hidden="true"><rect x="0" y="40" width="64" height="24" fill="#5DB8DD"/>
    <path d="M2 50q6-4 12 0t12 0t12 0t12 0t12 0" fill="none" stroke="#fff" stroke-width="2" opacity=".6"/>
    <g stroke="#2A2433" stroke-width="1.6" stroke-linejoin="round"><rect x="33" y="8" width="3.2" height="32" rx="1.6" fill="#6B4423"/>
    <path d="M36.2 11 Q54 23 36.4 36Z" fill="#FBF6EA"/><path d="M8 38h48l-3 6H11z" fill="#C98F52"/>
    <circle cx="20" cy="20" r="5.5" fill="#E2A57A"/><path d="M14.6 18.5c0-5 4-7 5.4-7s5.4 2 5.4 6.5c-2-2-7-2.5-10.8.5z" fill="#3B2A20"/>
    <rect x="14.5" y="25.5" width="11" height="12.5" rx="3.5" fill="#2E9E6B"/></g></svg>`;
  // Ícones das regras do nível Danilo: a ilha (com a lotação no selo) e a correnteza
  const isleIco = n => `<svg viewBox="0 0 40 40" aria-hidden="true" focusable="false"><path d="M0 26h40v14H0z" fill="#5DB8DD"/>` +
    `<path d="M3 34q4-2.5 8 0t8 0t8 0t8 0" fill="none" stroke="#fff" stroke-width="1.6" opacity=".7"/>` +
    `<ellipse cx="18" cy="26" rx="14" ry="5" fill="#E9D092" stroke="${INK}" stroke-width="1.4"/>` +
    `<path d="M16 25 Q15 16 19 9" fill="none" stroke="${INK}" stroke-width="4.2" stroke-linecap="round"/><path d="M16 25 Q15 16 19 9" fill="none" stroke="#8A5A33" stroke-width="2.2" stroke-linecap="round"/>` +
    `<g fill="#3FA66B" stroke="${INK}" stroke-width="1.2" stroke-linejoin="round"><path d="M19 9 Q11 5 5 11 Q12 8 19 9Z"/><path d="M19 9 Q27 4 33 10 Q26 8 19 9Z"/><path d="M19 9 Q17 2 10 2 Q16 4 19 9Z"/><path d="M19 9 Q23 2 29 3 Q23 5 19 9Z"/></g>` +
    (n ? `<circle cx="31" cy="29" r="7.5" fill="${INK}"/><text x="31" y="32.8" text-anchor="middle" font-family="Nunito,sans-serif" font-weight="900" font-size="11" fill="#fff">${n}</text>` : '') + `</svg>`;
  // Seta circular (recomeçar), para a regra dos níveis sem ajuda
  const RESTART_ICO = `<svg viewBox="0 0 40 40" aria-hidden="true" focusable="false"><rect x="4" y="4" width="32" height="32" rx="10" fill="#D9463B"/>` +
    `<g fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M27.5 20 A7.5 7.5 0 1 1 25.3 14.7"/><path d="M20.3 14.7 H25.3 V9.7"/></g></svg>`;
  const RAPIDS_ICO =`<svg viewBox="0 0 40 40" aria-hidden="true" focusable="false"><rect x="3" y="6" width="34" height="28" rx="8" fill="#2C84B3"/>` +
    `<g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12 l5 5 l5 -5 M21 12 l5 5 l5 -5"/><path d="M9 22 l5 5 l5 -5 M21 22 l5 5 l5 -5"/></g></svg>`;

  const ruleFig = k => figSVG(k, 'adult', 'ico-fig', '9 1 46 46').replace(/lz-clip/g, 'lz-clip-ico');
  function rulesFor(l) {
    const n = r => l.ids.filter(id => CAST[id].role === r).length;
    const isNew = k => [].concat(l.novo || []).includes(k);
    const dogs = n('cao'), sons = n('filho'), daus = n('filha');
    const doCao = dogs > 1 ? 'dos cachorros' : 'do cachorro';
    const items = [
      { key: 'cap', icon: raftSVG(), html: dogs ? `A jangada leva no máximo <b>2 passageiros</b> por vez. ${dogs > 1 ? 'Cada cachorro' : 'O cachorro'} conta como um.` : 'A jangada leva no máximo <b>2 pessoas</b> por vez.' },
      { key: 'drive', icon: HELM, html: `Só <b>o pai, a mãe e ${n('pol') > 1 ? 'os policiais' : 'o policial'}</b> sabem conduzir a jangada.` },
    ];
    if (l.ilha) {
      items.push({ key: 'rota', icon: isleIco(), novo: isNew('rota'), html: 'No meio do rio há uma <b>ilha</b>, e a jangada sempre para nela: partida ↔ ilha ↔ chegada.' });
      items.push({ key: 'lotacao', icon: isleIco(l.ilha.cap), novo: isNew('lotacao'), html: `A ilha é pequena: cabem no máximo <b>${l.ilha.cap}</b> nela, contando quem está na jangada parada lá.` });
      if (l.ilha.correnteza) items.push({ key: 'correnteza', icon: RAPIDS_ICO, novo: isNew('correnteza'),
        html: `Entre a ilha e a chegada há <b>correnteza</b>: nesse trecho, só ${n('pol') > 1 ? 'os policiais conseguem' : 'o policial consegue'} conduzir.` });
    }
    if (daus) items.push({ key: 'pai', icon: ruleFig('pai'), html: `O pai não pode ficar com <b>${daus > 1 ? 'nenhuma das filhas' : 'a filha'}</b> sem a mãe por perto.` });
    if (sons) items.push({ key: 'mae', icon: ruleFig('mae'), html: `A mãe não pode ficar com <b>${sons > 1 ? 'nenhum dos filhos' : 'o filho'}</b> sem o pai por perto.` });
    items.push({ key: 'ladrao', icon: ruleFig('ladrao'), novo: isNew('ladrao'), html: n('lad') > 1
      ? `Cada policial só vigia <b>um ladrão</b>. Perto da família ou ${doCao}, precisa haver um policial para cada ladrão.`
      : `O ladrão não pode ficar com <b>ninguém da família${dogs ? ', nem com o cachorro,' : ''}</b> sem o policial por perto.` });
    if ((l.regras || []).includes('criancas')) items.push({ key: 'criancas', icon: figSVG('filha1', 'kid', 'ico-fig', '11 5 42 42'), novo: isNew('criancas'),
      html: 'As crianças nunca podem ficar <b>sem um adulto responsável</b> por perto: o pai, a mãe ou um policial. O ladrão não conta.' });
    if ((l.regras || []).includes('caoPai')) items.push({ key: 'caoPai', icon: figSVG('cao', 'pet', 'ico-fig', '4 -2 62 62'), novo: isNew('caoPai'),
      html: 'O cachorro não suporta o ladrão: os dois só podem ficar no mesmo lugar se <b>o pai</b> também estiver.' });
    if (l.erroRecomeca) items.unshift({ key: 'erroRecomeca', icon: RESTART_ICO,
      html: 'Neste nível não dá para desfazer um erro: quebrou uma regra, a partida volta <b>do início</b>.' });
    return items;
  }

  function buildCast(ctx) {
    els = {}; tagEls = {};
    IDS.forEach((id, i) => {
      const p = CAST[id];
      const t = ctx.h('span', { class: 'tag', html: `${p.driver ? HELM : ''}${p.name}`, onclick: () => tapChar(id) });
      const b = ctx.h('button', { type: 'button', class: `char ${p.size}${p.role === 'lad' ? ' is-thief' : ''}`, style: { '--i': i }, onclick: () => tapChar(id),
        onfocus: () => t.classList.toggle('focus', b.matches(':focus-visible')), onblur: () => t.classList.remove('focus') },
      ctx.h('span', { class: 'bob', html: `<span class="bang" aria-hidden="true">!</span>${figSVG(id, p.size)}` }));
      scene.insertBefore(b, tagsEl);
      tagsEl.append(t);
      els[id] = b;
      tagEls[id] = t;
    });
  }

  // Lugar de cada um na ilha: quem chega pega o primeiro livre e fica nele até sair
  function seatIsland() {
    const here = IDS.filter(id => S.loc[id] === 'I');
    for (const id of Object.keys(islandSeat)) if (!here.includes(id)) delete islandSeat[id];
    const used = new Set(Object.values(islandSeat));
    for (const id of here) if (!(id in islandSeat)) {
      const j = G.islotOrder.find(k => !used.has(k)) ?? 0;
      islandSeat[id] = j;
      used.add(j);
    }
  }

  function render(dur = 0) {
    if (!G) return;
    const r = raftPos(raftAt);
    raftEl.style.setProperty('--dur', dur + 'ms');
    raftEl.style.transform = `translate3d(${r.x.toFixed(1)}px, ${r.y.toFixed(1)}px, 0)`;
    raftEl.style.zIndex = Math.round(r.feet);
    if (LV.ilha) seatIsland();
    const f = status === 'fail' ? failInfo : null;
    for (const id of IDS) {
      const p = CAST[id], el = els[id], t = tagEls[id], loc = S.loc[id];
      let x, feet, z;
      if (loc === 'R') { x = r.x + G.rw * (S.seats.indexOf(id) ? 0.71 : 0.29); feet = r.feet; z = Math.round(feet) + 2; }
      else if (loc === 'I') { ({ x, feet } = G.islot[islandSeat[id]]); z = Math.round(feet); }
      else { ({ x, feet } = G.slot[loc][id]); z = Math.round(feet); }
      el.style.setProperty('--dur', dur + 'ms');
      el.style.transform = `translate3d(${(x - G.cw / 2).toFixed(1)}px, ${(feet - figH(G, id)).toFixed(1)}px, 0)`;
      el.style.zIndex = z;
      const alarm = !!f && (f.culprits.includes(id) || f.victims.includes(id)), hinted = hintIds.includes(id);
      el.classList.toggle('alarm', alarm);
      el.classList.toggle('culprit', !!f && f.culprits.includes(id));
      el.classList.toggle('hinted', hinted);
      el.classList.toggle('cheer', status === 'won');
      t.style.setProperty('--dur', dur + 'ms');
      t.style.transform = `translate3d(${x.toFixed(1)}px, ${(feet + 1).toFixed(1)}px, 0) translateX(-50%)`;
      t.style.zIndex = z;
      t.classList.toggle('alarm', alarm);
      t.classList.toggle('hinted', hinted);
      el.setAttribute('aria-label', `${p.name}${p.driver ? ' (sabe conduzir)' : ''}, ${NA[loc]}`);
    }
    renderBar();
  }

  // Para onde a jangada pode ir: o botão principal segue rumo à chegada; o alternativo (só na ilha) volta para a partida
  const primaryTo = () => (LV.ilha ? (S.raft === 'I' ? 'B' : 'I') : other(S.raft));
  const altTo = () => (LV.ilha && S.raft === 'I' ? 'A' : null);
  const polArt = () => (count('pol') > 1 ? 'um policial' : 'o policial');
  function goLabel(to, text) {
    const fwd = ORDEM[to] > ORDEM[S.raft];
    const a = `<span class="arrow" aria-hidden="true">${G && G.vert ? (fwd ? '↑' : '↓') : (fwd ? '→' : '←')}</span>`;
    return fwd || !LV.ilha ? `${text} ${a}` : `${a} ${text}`;
  }
  // Por que a jangada não pode ir até "to" agora (null se pode)
  function blocker(to) {
    const riders = S.seats.filter(Boolean);
    if (!riders.length) return 'vazia';
    if (!riders.some(id => CAST[id].driver)) return 'drive';
    if (!riders.some(id => driverRoles(LV, S.raft, to).includes(CAST[id].role))) return 'correnteza';
    if (to === 'I' && IDS.filter(id => S.loc[id] === 'I').length + riders.length > LV.ilha.cap) return 'lotacao';
    return null;
  }

  function renderBar() {
    const ctx = ctxRef, riders = S.seats.filter(Boolean);
    ctx.setMoves(S.moves);
    ctx.busy(status === 'moving');
    ctx.controls({ undo: history.length > 0 });
    const to = primaryTo(), back = altTo(), narrow = G && G.vert, onIsle = back != null;
    const text = !LV.ilha ? 'Atravessar' : onIsle ? (narrow ? 'Chegada' : 'Seguir para a chegada') : 'Ir para a ilha';
    ctx.primary(goLabel(to, text), { disabled: !!blocker(to) });
    ctx.alt(onIsle ? goLabel(back, narrow ? 'Partida' : 'Voltar para a partida') : null, { disabled: onIsle && !!blocker(back) });
    if (status === 'moving') return ctx.say('Atravessando…', riders.length ? `Na jangada: ${crewNames(riders)}.` : '');
    if (status !== 'play') return;
    if (!riders.length) return ctx.say(S.moves ? 'Quem vai agora?' : 'Sua vez', `Toque em alguém ${DA[S.raft]} para embarcar. Cabem 2 na jangada.` +
      (onIsle ? ' Da ilha, a jangada pode voltar para a partida ou seguir para a chegada.' : '') +
      (LV.erroRecomeca && !S.moves ? ' Aqui, quem quebrar uma regra recomeça do início.' : ''));
    if (!riders.some(id => CAST[id].driver)) return ctx.say('Falta quem conduza', `${cap1(crewArt(riders))} não ${riders.length > 1 ? 'sabem' : 'sabe'} conduzir. Embarque ${count('pol') > 1 ? 'o pai, a mãe ou um policial' : 'o pai, a mãe ou o policial'}.`);
    const crew = `Na jangada: ${crewNames(riders)}.`;
    if (!LV.ilha) return ctx.say('Pronto para atravessar', `${crew} Toque em Atravessar.`);
    const why = blocker(to);
    if (onIsle) return why === 'correnteza'
      ? ctx.say('Pronto para voltar', `${crew} Para seguir até a chegada, só com ${polArt()} a bordo (correnteza).`)
      : ctx.say('Para onde?', `${crew} Volte para a partida ou siga para a chegada.`);
    if (why === 'correnteza') return ctx.say(`Falta ${polArt()}`, `Entre a chegada e a ilha há correnteza: só ${polArt()} consegue conduzir nesse trecho.`);
    if (why === 'lotacao') return ctx.say('Não cabe na ilha', `A ilha já tem ${IDS.filter(id => S.loc[id] === 'I').length} e cabem no máximo ${LV.ilha.cap}, contando quem chega na jangada.`);
    ctx.say('Pronto para ir', `${crew} Toque em Ir para a ilha.`);
  }

  function retriggerEl(el) { el.classList.remove('nope'); void el.offsetWidth; el.classList.add('nope'); ctxRef.later(() => el.classList.remove('nope'), 420); }

  function tapChar(id) {
    if (status !== 'play' || ctxRef.status !== 'play') return;
    const loc = S.loc[id];
    if (loc === 'R') {
      S.seats[S.seats.indexOf(id)] = null;
      S.loc[id] = S.raft;
    } else if (loc === S.raft) {
      const free = S.seats.indexOf(null);
      if (free < 0) { retriggerEl(raftEl); return ctxRef.warn('A jangada está cheia', 'Ela leva no máximo 2. Toque em alguém na jangada para desembarcar.', 'cap'); }
      S.seats[free] = id;
      S.loc[id] = 'R';
    } else {
      retriggerEl(els[id]);
      return ctxRef.warn(LV.ilha ? 'A jangada está em outro lugar' : 'A jangada está do outro lado', `Para levar ${art(id)}, traga a jangada até ${ATE[loc]} primeiro.`);
    }
    const t = TIME().walk;
    const el = els[id];
    el.classList.remove('walk'); void el.offsetWidth; el.classList.add('walk');
    ctxRef.later(() => el.classList.remove('walk'), t);
    render(t);
  }

  function cross(to) {
    if (status !== 'play' || !to) return;
    const from = S.raft, riders = S.seats.filter(Boolean), why = blocker(to);
    if (why) {
      retriggerEl(raftEl);
      if (why === 'vazia') return ctxRef.warn('A jangada está vazia', `Toque em alguém ${DA[from]} para embarcar.`);
      if (why === 'drive') return ctxRef.warn('Falta quem conduza', `Só ${driversText()} sabem conduzir a jangada.`, 'drive');
      if (why === 'correnteza') return ctxRef.warn('Correnteza forte', `Entre a ilha e a margem de chegada, só ${polArt()} consegue conduzir. Embarque ${polArt()}.`, 'correnteza');
      return ctxRef.warn('Não cabe na ilha', `A ilha já tem ${IDS.filter(id => S.loc[id] === 'I').length} e cabem no máximo ${LV.ilha.cap}, contando quem chega na jangada.`, 'lotacao');
    }
    history.push(clone(S));
    const fail = check(IDS.filter(id => S.loc[id] === from), from) || check(riders, 'R') ||
      check(IDS.filter(id => S.loc[id] === to).concat(riders), to);
    S.raft = to;
    S.moves++;
    raftAt = fail && fail.place === 'R' ? `${from}>${to}` : to;
    hintIds = [];
    status = 'moving';
    const t = TIME().cross;
    render(t);
    ctxRef.later(() => {
      if (fail) {
        status = 'fail'; failInfo = fail;
        render(0);
        // No NG+ e no Danilo o erro não se desfaz: a partida volta do início
        return ctxRef.fail({ title: 'Regra quebrada!', rule: fail.rule, final: !!LV.erroRecomeca,
          text: failText(fail) + (LV.erroRecomeca ? ' Neste nível não dá para desfazer: a partida recomeça do início.' : '') });
      }
      if (IDS.every(id => S.loc[id] === 'B' || (S.loc[id] === 'R' && S.raft === 'B'))) return win();
      status = 'play';
      render(0);
    }, t + 40);
  }

  function win() {
    S.seats.forEach(id => { if (id) S.loc[id] = 'B'; });
    S.seats = [null, null];
    status = 'won';
    render(TIME().walk);
    ctxRef.win();
  }

  function undo() {
    if (status === 'moving' || !history.length) return;
    S = history.pop(); raftAt = S.raft; failInfo = null; hintIds = [];
    const ms = Math.round(TIME().cross * 0.7);
    status = 'moving';
    render(ms);
    ctxRef.later(() => { status = 'play'; render(0); }, ms + 40);
  }

  // A dica continua implementada, mas o botão está desligado em todos os níveis (DICAS = true religa)
  const DICAS = false;
  const ROUTE_TXT = { AI: 'da partida até a ilha', IA: 'da ilha de volta para a partida', IB: 'da ilha até a chegada', BI: 'da chegada de volta para a ilha' };
  function hint() {
    if (status !== 'play') return;
    const where = Object.fromEntries(IDS.map(id => [id, S.loc[id] === 'R' ? S.raft : S.loc[id]]));
    const path = solve(LV, where, S.raft);
    if (!path) return ctxRef.warn('Sem saída daqui', 'Desfaça algumas travessias e tente outro caminho.');
    const m = path[0];
    // Quem vai: primeiro quem já está na jangada, depois quem está no lugar onde ela está
    const pool = [...S.seats.filter(Boolean), ...IDS.filter(id => S.loc[id] === S.raft)];
    hintIds = ROLES.flatMap((r, k) => pool.filter(id => CAST[id].role === r).slice(0, m.g[k]));
    render(0);
    const rota = LV.ilha ? `, ${ROUTE_TXT[m.from + m.to]}` : '';
    ctxRef.hint('Dica', `Próxima travessia: ${crewArt(hintIds, true)}${rota}. Daqui, dá para terminar em ${path.length} travessia${path.length > 1 ? 's' : ''}.`);
  }

  LEVELS.forEach(l => { l.sub = `<span class="cnt">${l.ids.length} personagens · </span>mín. ${l.min}`; });

  Jogos.register({
    id: 'travessia',
    name: 'Travessia do Rio',
    tagline: 'O teste de QI japonês: leve todo mundo para a outra margem sem quebrar as regras.',
    icon: ICON,
    css: CSS,
    metric: { label: 'Travessias', unit: ['travessia', 'travessias'] },
    levels: LEVELS,
    rules: rulesFor,
    how: l => (l.ilha
      ? 'As regras valem nas margens, na ilha e também dentro da jangada. Toque em uma pessoa para embarcar ou desembarcar; na ilha, escolha se a jangada <b>volta para a partida</b> ou <b>segue para a chegada</b>.'
      : 'As regras valem nas duas margens e também dentro da jangada. Toque em uma pessoa para embarcar ou desembarcar e depois em <b>Atravessar</b>.'),
    mount(ctx) {
      ctxRef = ctx;
      LV = ctx.level;
      IDS = LV.ids;
      REGRAS = LV.regras || [];
      reduceMotion = { get matches() { return ctx.reduced; } };
      S = initState(); history = []; status = 'play'; raftAt = 'A'; failInfo = null; hintIds = []; islandSeat = {}; G = null;
      ctx.setMin(LV.min);
      scene = ctx.h('div', { class: 'scene' });
      bg = ctx.svg('svg', { class: 'tv-bg', 'aria-hidden': 'true', focusable: 'false' });
      raftEl = ctx.h('div', { class: 'raft', 'aria-hidden': 'true' }, ctx.h('div', { class: 'raft-in', html: raftSVG() }));
      tagsEl = ctx.h('div', { class: 'tags', 'aria-hidden': 'true' });
      scene.append(bg, raftEl, tagsEl);
      ctx.board.append(scene);
      buildCast(ctx);
      ctx.onResize(() => layout());
      layout();   // já na montagem
      const ctrl = { onPrimary: () => cross(primaryTo()), onAlt: () => cross(altTo()), onUndo: undo };
      if (DICAS) ctrl.onHint = hint;   // sem onHint, o kit esconde o botão Dica
      return ctrl;
    },
  });
})();


/* ===== hanoi ===== */
/* Torre de Hanói — leve a torre do pino da esquerda para o da direita */
(() => {
  // ---------- lógica pura (testável no Node) ----------
  // pos[d] = pino (0, 1 ou 2) do disco d; o disco 1 é o menor.
  // Próximo movimento ótimo para juntar os discos 1..k no pino `alvo`, a partir de qualquer arrumação válida.
  function nextMove(pos, k, alvo) {
    if (k === 0) return null;
    if (pos[k] === alvo) return nextMove(pos, k - 1, alvo);
    const aux = 3 - pos[k] - alvo;
    return nextMove(pos, k - 1, aux) || { disk: k, from: pos[k], to: alvo };
  }
  // Quantos movimentos faltam na melhor solução.
  function distance(pos, k, alvo) {
    if (k === 0) return 0;
    if (pos[k] === alvo) return distance(pos, k - 1, alvo);
    return distance(pos, k - 1, 3 - pos[k] - alvo) + 2 ** (k - 1);
  }
  const posFrom = pegs => { const pos = []; pegs.forEach((p, i) => p.forEach(d => { pos[d] = i; })); return pos; };
  const logic = { nextMove, distance, posFrom };
  if (typeof module !== 'undefined' && module.exports) { module.exports = logic; return; }

    id: 'hanoi',

    icon: ICON,
    css: CSS,
    metric: { label: 'Movimentos', unit: ['movimento', 'movimentos'] },
    levels: [
      { id: 'facil', name: 'Fácil', n: 3, blurb: 'Três discos para pegar o jeito.' },
      { id: 'medio', name: 'Médio', n: 4, blurb: 'Quatro discos: o padrão começa a aparecer.' },

    mount(ctx) {
      const { h } = ctx, n = ctx.level.n, min = 2 ** n - 1;
      let pegs = [Array.from({ length: n }, (_, i) => n - i), [], []];
      let sel = null, moves = 0, hint = null, anim = false;
      const history = [];
      ctx.setMin(min);

      const area = h('div', { class: 'hn-area' });

        type: 'button', class: 'hn-peg' + (i === ALVO ? ' target' : ''), style: { '--i': i }, onclick: () => tap(i),
      }, h('span', { class: 'hn-rod' }), h('span', { class: 'hn-name' }, ['Início', 'Meio', 'Destino'][i])));

      area.append(h('div', { class: 'hn-base' }), ...pegEls, ...Object.values(disks));
      ctx.board.append(area);

      let L = null;
      const doLayout = w => {
        const areaW = Math.min(w - 36, 760), col = areaW / 3;
        const dh = Math.max(16, Math.min(30, col * 0.14));
        const rod = (n + 1) * dh + 6, nameH = 24, baseH = 16, lift = dh + 18;
        L = { col, dh, rod, baseTop: lift + rod, height: lift + rod + baseH + nameH };
        L.diskW = d => col * (0.3 + 0.62 * (n === 1 ? 1 : (d - 1) / (n - 1)));
        Object.entries({ '--hn-col': col + 'px', '--hn-dh': dh - 2 + 'px', '--hn-rod': rod + 'px', '--hn-rod-b': baseH + nameH - 1 + 'px', '--hn-base-b': nameH + 'px', '--hn-h': L.height + 'px' })
          .forEach(([k, v]) => area.style.setProperty(k, v));
        for (let d = 1; d <= n; d++) disks[d].style.width = L.diskW(d) + 'px';

        void area.offsetWidth;

      }

        if (!L) return;

          const lifted = sel === i && k === stack.length - 1;
          place(d, i, lifted ? 4 : L.baseTop - (k + 1) * L.dh);
        }));
        if (over) place(over.disk, over.peg, 4);        // disco atravessando por cima dos pinos
        pegEls.forEach((el, i) => {
          el.classList.toggle('sel', sel === i);

          const top = pegs[i][pegs[i].length - 1];
          el.setAttribute('aria-label', `Pino ${NOMES[i]}${i === ALVO ? ' (destino)' : ''}: ${pegs[i].length ? `${pegs[i].length} disco${pegs[i].length > 1 ? 's' : ''}, o de cima é o disco ${top}` : 'vazio'}`);
        });
        for (let d = 1; d <= n; d++) disks[d].classList.toggle('hinted', !!hint && hint.disk === d);
        ctx.controls({ undo: history.length > 0 && !anim });

        if (ctx.status !== 'play') return;
        if (sel != null) ctx.say(`Disco ${pegs[sel][pegs[sel].length - 1]} levantado`, 'Toque no pino onde quer colocá-lo. Tocar no mesmo pino devolve o disco.');
        else ctx.say(moves ? 'Continue' : 'Sua vez', moves ? 'Toque em um pino para levantar o disco de cima.' : 'Toque no pino da esquerda para levantar o disco de cima.');
      }

      function tap(i) {
        if (anim || ctx.status !== 'play') return;

          if (!pegs[i].length) { ctx.retrigger(pegEls[i]); return ctx.warn('Pino vazio', 'Escolha um pino que tenha discos.'); }

        }
        if (sel === i) { sel = null; return render(); }
        const d = pegs[sel][pegs[sel].length - 1], top = pegs[i][pegs[i].length - 1];

          ctx.retrigger(disks[d]);

        }
        move(sel, i, true);
      }

      function move(from, to, record) {
        const d = pegs[from].pop();
        pegs[to].push(d);
        sel = null;
        hint = null;
        if (record) { history.push({ from, to }); moves++; } else moves--;

        if (ctx.reduced) { render(); return afterMove(); }
        anim = true;
        render({ disk: d, peg: to });          // primeiro por cima do pino de destino...
        ctx.later(() => { anim = false; render(); afterMove(); }, 190);   // ...depois desce

        if (pegs[ALVO].length === n) ctx.win();
      }

      ctx.listen(window, 'keydown', e => {
        if (e.target.closest && e.target.closest('input, textarea, select')) return;
        if (['1', '2', '3'].includes(e.key)) { e.preventDefault(); tap(+e.key - 1); }
        else if (e.key === 'Escape' && sel != null) { sel = null; render(); }
      });

      return {
        onHint() {
          const pos = posFrom(pegs);
          const m = nextMove(pos, n, ALVO);
          if (!m) return;
          hint = m;
          if (sel != null && sel !== m.from) sel = null;
          render();
          ctx.hint('Dica', `Mova o disco ${m.disk} do pino ${NOMES[m.from]} para o pino ${NOMES[m.to]}. Daqui, faltam ${distance(pos, n, ALVO)} movimentos.`);
        },
        onUndo() {
          const last = history.pop();
          if (!last || anim) return;
          sel = null;
          move(last.to, last.from, false);
        },
      };
    },
  });
})();


/* ===== balanca ===== */
/* Moeda falsa — ache a moeda falsa com uma balança de dois pratos, gastando o mínimo de pesagens */
(() => {
  // ---------- lógica pura (testável no Node) ----------
  const K = typeof JogosCore !== 'undefined' ? JogosCore : require('../kit-core.js');

  // Parâmetros dos níveis. dirs: sentidos possíveis da falsa (-1 mais leve, +1 mais pesada).
  // modo 'tudo': é preciso saber a moeda e o sentido (se só existe um sentido, basta a moeda);
  // modo 'moeda': basta dizer qual é a moeda.
  const NIVEIS = [
    { id: 'facil', name: 'Fácil', n: 3, dirs: [-1], pesagens: 1, modo: 'tudo' },
    { id: 'medio', name: 'Médio', n: 9, dirs: [-1], pesagens: 2, modo: 'tudo' },
    { id: 'dificil', name: 'Difícil', n: 4, dirs: [-1, 1], pesagens: 2, modo: 'moeda' },
    { id: 'muito', name: 'Muito difícil', n: 12, dirs: [-1, 1], pesagens: 3, modo: 'tudo' },
  ];

  // Hipótese = "a moeda i (0..n-1) é a falsa e é mais leve (s = -1) ou mais pesada (s = +1)". Código: 2i ou 2i+1.
  const hyp = (i, s) => 2 * i + (s > 0 ? 1 : 0);
  const coinOf = h => h >> 1;
  const dirOf = h => (h & 1 ? 1 : -1);
  function initial(n, dirs) {
    const S = [];
    for (let i = 0; i < n; i++) for (const s of dirs) S.push(hyp(i, s));
    return S.sort((a, b) => a - b);
  }

  // Resultado da pesagem w = { left: [moedas], right: [moedas] } se a hipótese h for a verdade:
  // +1 = o prato direito desce (a esquerda sobe), -1 = o esquerdo desce (a direita sobe), 0 = equilibra.
  function outcome(h, w) {
    const i = coinOf(h), s = dirOf(h);
    if (w.left.includes(i)) return -s;
    if (w.right.includes(i)) return s;
    return 0;
  }
  function branches(S, w) {
    const b = { '-1': [], 0: [], 1: [] };
    S.forEach(h => b[outcome(h, w)].push(h));
    return b;
  }

  // Tipo de cada moeda diante das hipóteses vivas:
  // u = pode ser leve ou pesada, l = só pode ser leve, p = só pode ser pesada, g = com certeza verdadeira.
  function types(S, n) {
    const L = new Set(), P = new Set();
    S.forEach(h => (dirOf(h) < 0 ? L : P).add(coinOf(h)));
    const t = { u: [], l: [], p: [], g: [] };
    for (let i = 0; i < n; i++) t[L.has(i) ? (P.has(i) ? 'u' : 'l') : P.has(i) ? 'p' : 'g'].push(i);
    return t;
  }
  const count = t => ({ u: t.u.length, l: t.l.length, p: t.p.length, g: t.g.length });
  const nHyp = c => 2 * c.u + c.l + c.p;
  const nCoins = c => c.u + c.l + c.p;
  const size = (c, modo) => (modo === 'moeda' ? nCoins(c) : nHyp(c));
  const isSolved = (c, modo) => size(c, modo) <= 1;

  // Todas as pesagens possíveis, contadas por tipo de moeda: [lu, ru, ll, rl, lp, rp, lg, rg]
  // (quantas de cada tipo vão à esquerda e à direita), sempre com o mesmo número de moedas nos dois pratos.
  // Moedas verdadeiras nos dois pratos se anulam, então essas variações ficam de fora.
  const optMemo = new Map();
  function options(c) {
    const key = `${c.u},${c.l},${c.p},${c.g}`;
    if (optMemo.has(key)) return optMemo.get(key);

              h('span', { class: 'bl-hw' }, chips(e.left), h('span', { class: 'bl-x' }, '×'), chips(e.right)),
              h('span', { class: 'bl-res' }, h('span', { html: resIcon(e.t), style: { display: 'inline-flex' } }), RES[e.t]))));
        }

      const calm = () => { if (ctx.clearWarn) ctx.clearWarn(); };   // o aviso anterior já não vale

        if (anim || end || ctx.status !== 'play') return;
        fresh = false;
        calm();
        if (mode === 'anotar') { notes[i] = (notes[i] + 1) % (soLeve ? 3 : 4); return render(); }
        if (mode === 'apontar' || over()) { sel = sel === i ? null : i; return render(); }
        moveCoin(i);
      }
      // mesa → prato esquerdo → prato direito → mesa (pulando o prato que estiver cheio)
      function moveCoin(i) {
        const cur = where[i];
        let next = cur === 0 ? -1 : cur === -1 ? 1 : 0;
        if (next && pans[next].length >= cap) {
          const motivo = `Com ${n} moedas, cada prato leva no máximo ${cap}: mais do que isso não daria o mesmo número dos dois lados.`;
          if (cur === 0 && pans[1].length < cap) next = 1;          // esquerda cheia: vai direto para a direita
          else if (cur === 0) { ctx.retrigger(coins[i]); return ctx.warn('Pratos cheios', motivo, 'pesar'); }
          else { next = 0; ctx.warn('Prato direito cheio', `${motivo} A moeda ${i + 1} voltou para a mesa.`, 'pesar'); }
        }
        if (cur) pans[cur].splice(pans[cur].indexOf(i), 1);
        where[i] = next;
        if (next) pans[next].push(i);

        render();
      }
      // Mexeu nos pratos depois de uma pesagem: a balança volta a ficar travada e nivelada.
      function unlock() {
        if (!shown) return;
        shown = false;
        if (rest !== 0) { rest = 0; animateTo(0, 'ease'); }
      }
      function clearPans() {
        if (anim || end) return;
        fresh = false;
        calm();
        for (const s of [-1, 1]) { pans[s].forEach(i => { where[i] = 0; }); pans[s].length = 0; }
        unlock();
        render();
      }
      function eraseNotes() { if (end) return; calm(); notes.fill(0); render(); }

        if (anim || end || ctx.status !== 'play' || (m === 'mover' && over())) return;

        fresh = false;
        calm();
        if (m !== 'apontar') sel = null;
        render();

      function weigh() {
        const nl = pans[-1].length, nr = pans[1].length;
        if (!nl && !nr) return ctx.warn('Pratos vazios', 'Toque nas moedas para colocá-las nos pratos antes de pesar.', 'pesar');
        if (nl !== nr) return ctx.warn('Pratos desiguais', `Há ${plural(nl, 'moeda', 'moedas')} na esquerda e ${nr} na direita. Deixe o mesmo número nos dois pratos.`, 'pesar');
        const by = (a, b) => a - b, w = { left: pans[-1].slice().sort(by), right: pans[1].slice().sort(by) };
        const rep = hist.findIndex(x => (same(x.left, w.left) && same(x.right, w.right)) || (same(x.left, w.right) && same(x.right, w.left)));
        if (rep >= 0) return ctx.warn('Pesagem repetida', `Essa é a mesma pesagem ${rep + 1}, então o resultado seria igual. Troque alguma moeda de lugar.`);
        const r = respond(S, w, n, limit - used - 1, modo, ctx.rng);
        S = r.S;
        used++;
        hist.push({ left: w.left, right: w.right, t: r.t });

        ctx.busy(true);
        render();
        animateTo(rest, 'swing', () => {

          ctx.busy(false);

        });

      function accuse() {
        if (sel == null) {

        if (pedeSentido && selDir == null) return ctx.warn('Mais leve ou mais pesada?', 'Escolha o sentido logo abaixo da balança antes de acusar.', 'acusar');

      function winNow() {
        const ds = [...new Set(S.map(dirOf))], d = ds.length === 1 ? ds[0] : null;
        end = { ok: true, fake: sel, label: d && !soLeve ? `falsa · ${dirTxt(d)}` : 'falsa' };
        hintW = null;
        render();
        const sent = d ? `, ${dirTxt(d)},` : '';
        const extra = modo === 'moeda' && !d ? ' Se ela é mais leve ou mais pesada, as pesagens não dizem, e nem precisava.' : '';
        ctx.win({ score: used, title: 'Achou a moeda falsa!', text: `A moeda ${sel + 1}${sent} é a falsa, e as pesagens não deixavam outra possibilidade.${extra} Você usou ${plural(used, 'pesagem', 'pesagens')}.` });
      }
      // Por que a moeda (e o sentido, se dado) não pode ser a falsa, citando a primeira pesagem que desmente.
      function whyNot(coin, dir) {
        const ds = dir == null ? lv.dirs : [dir];
        const rs = ds.map(d => ({ d, r: refute(hist, hyp(coin, d)) })).filter(x => x.r);
        const frase = ({ d, r }) => {
          const k = r.k + 1;
          if (!r.side) return `na pesagem ${k} ela ficou fora da balança e os pratos não equilibraram`;
          if (r.t === 0) return `na pesagem ${k} ela estava no prato ${r.side} e a balança equilibrou`;
          const sobe = s => (r.side === 'esquerdo' ? s > 0 : s < 0);
          return `na pesagem ${k} o prato ${r.side}, onde ela estava, ${sobe(r.t) ? 'subiu' : 'desceu'}, e ${dirTxt(d)} ela o faria ${sobe(r.e) ? 'subir' : 'descer'}`;
        };
        const quem = `A moeda ${coin + 1}`;
        if (!rs.length) return `${quem} não pode ser a falsa.`;
        if (rs.length === 1) return `${quem} não pode ser a falsa${dir != null && !soLeve ? ` ${dirTxt(dir)}` : ''}: ${frase(rs[0])}.`;
        const [a, b] = rs;
        if (a.r.k === b.r.k && (a.r.t === 0 || !a.r.side)) return `${quem} não pode ser a falsa: ${frase(a)}.`;
        return `${quem} não pode ser a falsa: mais leve não, porque ${frase(a)}; mais pesada também não, porque ${frase(b)}.`;
      }
      function failNow(v) {
        const same = v.others.filter(x => coinOf(x) === sel);
        const alt = same.length ? same[0] : ctx.rng.pick(v.others);
        const ac = coinOf(alt), ad = dirOf(alt);
        const altTxt = `a moeda ${ac + 1}${soLeve ? '' : `, ${dirTxt(ad)}`}`;
        end = { ok: false, fake: ac, wrong: sel, label: soLeve ? 'falsa' : `falsa · ${dirTxt(ad)}` };

        render();

        let title, text;
        if (v.possible) {
