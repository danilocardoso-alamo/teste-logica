          text = used === 0
            ? `Sem nenhuma pesagem, qualquer moeda pode ser a falsa. Desta vez, era ${altTxt}.`
            : `Se a falsa fosse ${altTxt}, a balança teria mostrado exatamente os mesmos resultados. Então ela também explicava tudo, e desta vez era ela.` +
              `${total > 2 ? ` Ainda havia ${plural(total, 'possibilidade', 'possibilidades')}.` : ''} Só vence quem elimina todas as outras.`;
        } else {
          title = pedeSentido && S.some(x => coinOf(x) === sel) ? 'Sentido errado' : 'Essa moeda não é a falsa';
          text = `${whyNot(sel, pedeSentido ? selDir : null)} ${total === 1 ? 'Pelas pesagens, a falsa só podia ser' : 'A falsa podia ser, por exemplo,'} ${altTxt}.`;
        }
        ctx.fail({ title, text, rule: v.possible ? 'justa' : 'acusar' });
      }

      // ----- tamanho, teclado e início -----
      function resize(w) {
        const cs = getComputedStyle(ctx.board);
        const W = Math.floor(Math.max(240, Math.min(760, w - (parseFloat(cs.paddingLeft) || 0) - (parseFloat(cs.paddingRight) || 0))));
        if (L && L.W === W) return;
        L = layout(W);
        stage.style.setProperty('--bl-h', L.H + 'px');
        stage.style.setProperty('--bl-d', L.d + 'px');
        stage.classList.add('bl-instant');
        draw();
        render();
        void stage.offsetWidth;
        stage.classList.remove('bl-instant');
      }
      ctx.onResize(resize);
      ctx.listen(window, 'keydown', e => {
        if (e.key === 'Escape' && mode !== 'mover' && !over() && !anim && !end && ctx.status === 'play') pickMode('mover');
      });
      renderHist(false);
      if (ctx.board.clientWidth) resize(ctx.board.clientWidth);   // mede já na montagem: nenhum quadro sai sem as moedas no lugar
      else render();

      return {
        onPrimary() {
          if (anim || end) return;
          calm();
          if (mode === 'apontar' || over()) accuse(); else weigh();
        },
        onHint() {
          if (anim || end) return;
          const left = limit - used, a = advise(S, n, left, modo);
          const unit = m => (soLeve ? plural(m, 'suspeita', 'suspeitas') : modo === 'moeda' ? plural(m, 'moeda suspeita', 'moedas suspeitas') : plural(m, 'possibilidade', 'possibilidades'));
          if (a.solved) {
            hintW = null;
            render();
            const ds = [...new Set(S.map(dirOf))];
            const sent = soLeve ? '' : ds.length === 1 ? `, <b>${dirTxt(ds[0])}</b>,` : ' (se é leve ou pesada, tanto faz aqui)';
            return ctx.hint('Dica', `Já dá para concluir: só a moeda <b>${coinOf(S[0]) + 1}</b>${sent} explica todas as pesagens. Toque em <b>Apontar</b>, escolha essa moeda e depois em <b>Acusar</b>.`);
          }
          if (a.over) {
            hintW = null;
            render();
            const poss = modo === 'moeda' ? [...new Set(S.map(coinOf))].map(c => String(c + 1))
              : S.map(x => (soLeve ? String(coinOf(x) + 1) : `${coinOf(x) + 1} ${dirOf(x) < 0 ? 'leve' : 'pesada'}`));
            return ctx.hint('Dica', `As pesagens acabaram e ainda há ${unit(poss.length)}: ${poss.join(', ')}. Não dá mais para ter certeza. Recomece e tente dividir as moedas em três grupos.`);
          }
          hintW = a.w;
          render();
          const [lu, ru, ll, rl, lp, rp, lg, rg] = a.o, c = a.c;
          const noPrato = lu + ll + lp, fora = (c.u - lu - ru) + (c.l - ll - rl) + (c.p - lp - rp);
          const pese = `<b>${lst(a.w.left)} × ${lst(a.w.right)}</b> (esquerda × direita)`;
          let why;
          if (lg + rg) why = 'Complete os pratos com moedas que você já sabe que são verdadeiras: elas servem de peso de referência.';
          else if (lp + rp && ll + rl) why = 'Misture nos pratos moedas que só podem ser pesadas com moedas que só podem ser leves: cada resultado aponta para um grupo diferente.';
          else if (fora) why = `Divida as suspeitas em três grupos: ${noPrato} em cada prato e ${fora} fora da balança.`;
          else why = 'Divida as suspeitas entre os dois pratos.';
          if (!a.feasible) {
            return ctx.hint('Dica', `Daqui, mesmo sem errar, seriam precisas ${plural(a.needNow, 'pesagem', 'pesagens')}, e ${left > 1 ? `restam ${left}` : 'resta 1'}: já não dá para garantir a resposta. A melhor tentativa agora é pesar ${pese}. Ou recomece.`);
          }
          const rest1 = left - 1;
          const garante = rest1 === 0 ? 'Qualquer resultado deixa uma única resposta.'
            : `Qualquer resultado deixa no máximo ${unit(a.worst)}, e ${plural(rest1, 'pesagem resolve', 'pesagens resolvem')} isso.`;
          ctx.hint('Dica', `Pese ${pese}. ${why} ${garante}`);
        },
        destroy() { dead = true; cancelAnimationFrame(raf); },
      };
    },
  });
})();

/* Jarras d'água — meça a quantidade exata de água usando jarras sem marcação */
(() => {
  // ---------- lógica pura (testável no Node) ----------
  const K = typeof JogosCore !== 'undefined' ? JogosCore : require('../kit-core.js');

  // Estado: litros em cada jarra, na ordem da tela (ex.: [0, 5]).
  // Movimentos: { t: 'encher', i } · { t: 'esvaziar', i } · { t: 'despejar', de, para }
  // apply devolve o novo estado, ou null se a ação não muda nada (e então não conta movimento).
  function apply(caps, s, m) {
    const t = s.slice();
    if (m.t === 'encher') { if (s[m.i] >= caps[m.i]) return null; t[m.i] = caps[m.i]; return t; }
    if (m.t === 'esvaziar') { if (s[m.i] <= 0) return null; t[m.i] = 0; return t; }
    if (m.t === 'despejar') {
      const { de, para } = m;
      if (de === para || s[de] <= 0 || s[para] >= caps[para]) return null;
      const q = Math.min(s[de], caps[para] - s[para]);   // até o destino encher ou a origem esvaziar
      t[de] -= q; t[para] += q;
      return t;
    }
    return null;
  }
  // Todas as ações com efeito a partir de s. A ordem desempata a dica: encher, despejar, esvaziar.
  function options(caps, tap, s) {
    const out = [], n = caps.length;
    const add = m => { const st = apply(caps, s, m); if (st) out.push({ move: m, state: st }); };
    if (tap) for (let i = 0; i < n; i++) add({ t: 'encher', i });
    for (let de = 0; de < n; de++) for (let para = 0; para < n; para++) if (de !== para) add({ t: 'despejar', de, para });
    if (tap) for (let i = 0; i < n; i++) add({ t: 'esvaziar', i });
    return out;

  const NOMES = { facil: 'Fácil', medio: 'Médio', dificil: 'Difícil', muito: 'Muito difícil' };
  const BLURBS = {

    id: 'jarras',

    css: CSS,
    metric: { label: 'Movimentos', unit: ['movimento', 'movimentos'] },
    levels: LEVELS.map(l => Object.assign({}, l, {

      sub: `<span class="cnt">${capsTxt(l.caps)} · </span>mín. ${l.min}`,
    })),
    rules: lv => [
      ...(lv.tap ? [
        { key: 'encher', icon: ICO_R_ENCHER, html: '<b>Encher</b>: a torneira enche a jarra até a boca.' },
        { key: 'esvaziar', icon: ICO_R_RALO, html: '<b>Esvaziar</b>: toda a água da jarra vai para o ralo.' },

      { key: 'despejar', icon: ICO_R_DESPEJAR, html: '<b>Despejar</b>: a água passa até a jarra de destino encher ou a de origem ficar vazia.' },
      { key: 'meta', icon: ICO_R_META, html: `Meta: <b>${goalHTML(lv, false)}</b>. Cada ação conta um movimento.`, novo: lv.goal.type === 'duas' },
    ],
    how: lv => (lv.tap
      ? 'Toque em <b>Encher</b> ou <b>Esvaziar</b> em cada jarra. Para despejar, toque em uma jarra e depois na que vai receber a água.'
      : 'Para despejar, toque em uma jarra e depois na que vai receber a água.')
      + ' As jarras não têm marcas: a água só para quando uma jarra enche ou fica vazia.'
      + ` No teclado, ${lv.caps.length === 2 ? '<b>1</b> e <b>2</b>' : '<b>1</b>, <b>2</b> e <b>3</b>'} escolhem as jarras e <b>Esc</b> cancela.`,

    mount(ctx) {
      const { h } = ctx, lv = ctx.level, caps = lv.caps, n = caps.length, tap = lv.tap, uid = ++UID;
      let state = lv.start.slice(), moves = 0, sel = null, hint = null, done = false, lastMsg = null, L = null, fxTok = 0;
      const history = [];
      ctx.setMin(lv.min);

      // ----- montagem -----
      const goalEl = h('div', { class: 'jr-goal' },
        h('span', { class: 'jr-goal-ico', html: ICO_ALVO + ICO_OK }),
        h('span', { class: 'jr-goal-tx' }, h('span', { class: 'jr-goal-k' }, 'Meta'), h('span', { class: 'jr-goal-v', html: goalHTML(lv, true) })));
      const cols = caps.map((c, i) => {
        const o = {};
        o.stream = h('span', { class: 'jr-stream', 'aria-hidden': 'true' });

        o.num = h('b', {}, String(state[i]));
        const read = h('div', { class: 'jr-read', 'aria-hidden': 'true' }, o.num, h('span', {}, `/ ${c}\u00A0L`));
        if (tap) {
          o.fill = h('button', { type: 'button', class: 'jr-btn', 'aria-label': `Encher a jarra de ${c}\u00A0L na torneira`, onclick: () => fillJug(i) },
            h('span', { class: 'jr-bi', html: ICO_TORNEIRA }), 'Encher');
          o.drain = h('button', { type: 'button', class: 'jr-btn jr-drain', 'aria-label': `Esvaziar a jarra de ${c}\u00A0L no ralo`, onclick: () => emptyJug(i) },
            h('span', { class: 'jr-bi', html: ICO_RALO }), 'Esvaziar');
        }
        o.el = h('div', { class: 'jr-col' },
          tap ? h('div', { class: 'jr-tapcell' }, o.fill, h('span', { class: 'jr-nozzle', 'aria-hidden': 'true' })) : null,
          o.cell, read, tap ? o.drain : null);
        return o;
      });
      const fx = ctx.svg('svg', { class: 'jr-fx', 'aria-hidden': 'true' });
      const scene = h('div', { class: 'jr-scene' },
        h('div', { class: 'jr-counter', 'aria-hidden': 'true' }),

      const wrap = h('div', { class: 'jr-wrap' }, goalEl, scene);
      ctx.board.append(wrap);

      // ----- medidas: tudo em px, recalculado quando a largura muda -----
      // Todas as jarras têm a mesma largura e a altura proporcional à capacidade: 1 litro tem a mesma altura em todas.
      // layout() também roda uma vez no fim do mount: o ResizeObserver só avisa no próximo quadro desenhado.
      ctx.onResize(layout);
      function layout() {
        const W = wrap.clientWidth;
        if (!W) return;
        const gap = W < 460 ? 8 : 18;
        const colW = Math.floor(Math.min(n === 2 ? 220 : 196, (W - gap * (n - 1)) / n));
        const narrow = colW < 124;
        const bw = Math.round(clamp(colW * 0.58, 40, 108));
        const hw = Math.round(clamp(Math.min(bw * 0.24, (colW - bw) / 2 - 5), 7, 22));   // alça cabe na coluna
        const side = hw + 5;
        const maxIH = Math.round(clamp(W * 0.42, 140, 196));
        const maxC = Math.max(...caps);
        const jugs = caps.map(c => {
          const ih = Math.round(maxIH * c / maxC), y0 = 7, yFull = y0 + 5, yBot = yFull + ih, ob = yBot + 5;
          return { c, ih, bw, hw, y0, yFull, yBot, ob, H: ob + 1, W: bw + 2 * side, x0: side, x1: side + bw, r: Math.round(clamp(bw * 0.2, 7, 14)) };
        });
        const rowH = Math.max(...jugs.map(g => g.H)) + 30;
        const tapH = tap ? (narrow ? 70 : 56) : 0;
        L = { jugs, rowH, ct: tapH + rowH };
        const inset = Math.max(0, (W - (n * colW + (n - 1) * gap)) / 2 - 14);
        scene.classList.toggle('narrow', narrow);

        for (const k in vars) scene.style.setProperty(k, vars[k] + 'px');
        stopFx();
        cols.forEach((o, i) => {
          const g = jugs[i];
          o.jug.innerHTML = jugSVG(i, g);
          o.jug.style.marginLeft = -g.W / 2 + 'px';
          o.water = o.jug.querySelector('.jr-water');
          o.cell.style.setProperty('--jr-top', rowH - g.H + 'px');
          o.cell.style.setProperty('--jr-sh', rowH - g.H + g.yFull + 'px');
        });
        render();
      }
      // Deslocamento vertical da água (a água é desenhada cheia e desce conforme falta líquido)
      const waterY = (i, a) => { const g = L.jugs[i]; return a <= 0 ? g.ih + 9 : r1((g.c - a) * g.ih / g.c); };

      function jugSVG(i, g) {
        const id = `jr${uid}-${i}`, gl = 3, { x0, x1, y0, yFull, yBot, ob, r, ih, bw, hw } = g;
        const xi0 = x0 + gl, xi1 = x1 - gl, wi = xi1 - xi0, ri = Math.max(3, r - gl);
        const body = `M${x0} ${y0}V${ob - r}A${r} ${r} 0 0 0 ${x0 + r} ${ob}H${x1 - r}A${r} ${r} 0 0 0 ${x1} ${ob - r}V${y0}Z`;
        const inner = `M${xi0} ${y0 - 3}V${yBot - ri}A${ri} ${ri} 0 0 0 ${xi0 + ri} ${yBot}H${xi1 - ri}A${ri} ${ri} 0 0 0 ${xi1} ${yBot - ri}V${y0 - 3}Z`;
        const hy1 = r1(yFull + Math.min(8, ih * 0.12)), hy2 = r1(hy1 + clamp(ih * 0.46, 16, 64));
        const t = r1(Math.max(4, hw * 0.42)), hx = r1(x1 + hw * 1.33), hxi = r1(hx - t * 1.5);
        const handle = `M${x1} ${hy1}C${hx} ${hy1} ${hx} ${hy2} ${x1} ${hy2}V${r1(hy2 - t)}C${hxi} ${r1(hy2 - t)} ${hxi} ${r1(hy1 + t)} ${x1} ${r1(hy1 + t)}Z`;
        const spout = `M${x0 + 3} ${y0 - 2}L${x0 - 8} ${y0 - 6}L${x0 - 1} ${y0 + 4}Z`;
        const fs = r1(clamp(bw * 0.19, 11, 15)), txt = `${g.c}\u00A0L`, tw = r1(txt.length * fs * 0.56 + 12), th = r1(fs + 8);
        const cx = r1((x0 + x1) / 2), ty = yFull + 6;
        const OLs = 'stroke="#2A2433" stroke-width="1.6" stroke-linejoin="round"';

          + `<path d="M${xi0} ${yFull}H${xi1}" stroke="#2A2433" stroke-width="1.4"/>`

          + `<path d="${spout}" class="jr-glass2" ${OLs}/>`

      // ----- desenho do estado -----
      const jugOk = i => { const g = lv.goal, a = state[i]; return g.type === 'exata' ? g.v[i] > 0 && a === g.v[i] : a === g.v; };

        const base = `Jarra de ${caps[i]}\u00A0L, com ${state[i]}\u00A0L`;
        if (sel === i) return `${base}, escolhida. Toque de novo para cancelar.`;
        if (sel != null) return `${base}. Despejar aqui a água da jarra de ${caps[sel]}\u00A0L.`;
        return `${base}. Escolher para despejar em outra jarra.`;
      }
      function render() {
        const hp = hint && hint.t === 'despejar' ? hint : null;
        cols.forEach((o, i) => {
          const a = state[i], c = caps[i];
          if (o.water) o.water.style.transform = `translateY(${waterY(i, a)}px)`;
          o.num.textContent = a;
          o.cell.classList.toggle('sel', sel === i);
          o.cell.classList.toggle('dest', sel != null && sel !== i && a < c && !(hp && hp.para === i));
          o.cell.classList.toggle('hint-to', !!hp && hp.para === i);
          o.cell.setAttribute('aria-pressed', String(sel === i));
          o.cell.setAttribute('aria-label', cellLabel(i));
          o.jug.classList.toggle('hinted', !!hp && hp.de === i);
          if (tap) {
            o.fill.classList.toggle('off', a >= c);

            o.fill.classList.toggle('hinted', !!hint && hint.t === 'encher' && hint.i === i);
            o.drain.classList.toggle('hinted', !!hint && hint.t === 'esvaziar' && hint.i === i);

      function status() {

        if (lastMsg) return ctx.say(lastMsg.t, lastMsg.d);
        ctx.say('Sua vez', tap
          ? 'Toque em Encher para pegar água na torneira. Para despejar, toque em uma jarra e depois em outra.'
          : 'Toque na jarra cheia e depois em outra para despejar a água.');

          ctx.retrigger(cols[i].drain);

        if (!next) return;

        state = next;
        history.push({ prev, m });

        lastMsg = moveMsg(m, prev, next);
        const won = isGoal(lv.goal, state);
        if (won) done = true;               // trava novas jogadas enquanto a água termina de assentar
        const dur = animate(m);
        render();
        ctx.setMoves(moves);
        if (won) ctx.later(() => {
          wrap.classList.add('won');
          for (const o of cols) for (const b of [o.cell, o.fill, o.drain]) if (b) b.disabled = true;
          ctx.win();

      }

      // ----- animações (só enfeite: o estado já mudou; uma nova ação interrompe a anterior) -----
      const restart = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
      function stopFx() {
        fxTok++;
        fx.replaceChildren();
        for (const o of cols) {
          o.jug.classList.remove('tilt');
          o.stream.classList.remove('on');
          if (o.drain) o.drain.classList.remove('swirl');
          if (o.water) o.water.style.setProperty('--jr-wd', '0s');

      }
      function animate(m) {
        if (ctx.reduced || !L) return 0;
        const tok = ++fxTok;

          cols[m.i].water.style.setProperty('--jr-wd', '.12s');

      }
      function tilt(i, dir, deg, lift) {
        const o = cols[i], g = L.jugs[i];

        o.jug.style.setProperty('--jr-rot', dir * deg + 'deg');
        o.jug.style.setProperty('--jr-lift', -lift + 'px');

      }

        fx.style.setProperty('--jr-fd', dur);

      // Maior inclinação (até `want` graus) que mantém a jarra dentro do board: em telas estreitas
      // a primeira jarra fica colada à borda. O canto de cima anda altura × seno do ângulo para o lado.
      function safeTilt(i, dir, want) {
        const g = L.jugs[i], br = ctx.board.getBoundingClientRect(), cr = cols[i].cell.getBoundingClientRect();
        const left = cr.left - br.left + (cr.width - g.W) / 2;
        const room = dir < 0 ? left : ctx.board.clientWidth - (left + g.W);
        return Math.min(want, Math.asin(clamp((room - 2) / g.H, 0, 1)) * 180 / Math.PI);
      }
      // Posição (sem transformações) da jarra i nas coordenadas da cena
      function jugBox(i) {
        const sr = scene.getBoundingClientRect(), cr = cols[i].cell.getBoundingClientRect(), g = L.jugs[i];
        return { x: cr.left - sr.left + (cr.width - g.W) / 2, y: cr.top - sr.top + cr.height - g.H, g };
      }
      // Canto da boca do lado `dir` depois de a jarra girar `deg` graus em torno do canto de baixo
      function corner(i, dir, deg, lift) {
        const b = jugBox(i), g = b.g, a = dir * deg * Math.PI / 180, hgt = g.H - g.y0;
        const px = b.x + (dir > 0 ? g.x1 : g.x0), py = b.y + g.H;
        return { x: px + hgt * Math.sin(a), y: py - hgt * Math.cos(a) - lift };
      }
      // Jato da boca da jarra que despeja até a boca da outra, passando por cima das jarras do meio
      function pathPour(a, b, deg) {
        const dir = b > a ? 1 : -1, S = corner(a, dir, deg, LIFT), B = jugBox(b);
        const E = { x: B.x + (B.g.x0 + B.g.x1) / 2, y: B.y + B.g.y0 };
        let top = Math.min(S.y - 12, E.y - 24);
        for (let k = Math.min(a, b) + 1; k < Math.max(a, b); k++) { const M = jugBox(k); top = Math.min(top, M.y + M.g.y0 - 24); }
        const c1 = S.x + dir * Math.max(18, Math.abs(E.x - S.x) * 0.45);
        return { d: `M${r1(S.x)} ${r1(S.y)}C${r1(c1)} ${r1(top)} ${r1(E.x)} ${r1(top + 6)} ${r1(E.x)} ${r1(E.y)}` };
      }
      // Jato da boca até o balcão; o respingo não passa da borda esquerda do board
      function pathEmpty(i, deg) {
        const off = scene.getBoundingClientRect().left - ctx.board.getBoundingClientRect().left;
        const S = corner(i, -1, deg, 0), x = Math.max(S.x - 9, 18 - off), ground = L.ct + 1;
        return { d: `M${r1(S.x)} ${r1(S.y)}C${r1(S.x - 8)} ${r1(S.y - 5)} ${r1(x)} ${r1(S.y + 6)} ${r1(x)} ${r1(ground)}`, splash: { x: r1(x), y: r1(ground) } };
      }

      ctx.listen(window, 'keydown', e => {
        if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
        if (e.target.closest && e.target.closest('input, textarea, select')) return;
        const k = parseInt(e.key, 10);
        if (k >= 1 && k <= n) { e.preventDefault(); tapJug(k - 1); }

      layout();      // mede já (o board está no documento); se ainda não tiver largura, o onResize refaz depois
      if (!L) render();

        onHint() {
          if (blocked()) return;
          const r = solve(lv, state);
          if (!r) return ctx.hint('Dica', 'Daqui não dá para chegar à meta. Desfaça alguns movimentos ou recomece.');
          if (!r.path.length) return;

        onUndo() {
          if (done) return;

          if (!last) return;

          moves--;

          lastMsg = { t: 'Movimento desfeito', d: seguir() };
          render();
          ctx.setMoves(moves);
        },
      };
    },
  });

/* Senha secreta — descubra a sequência de cores escondida no cofre (estilo Mastermind) */
(() => {
  // ---------- lógica pura (testável no Node) ----------
  // Uma senha é uma lista de índices de cor (0 = primeira cor da paleta do nível).
  const LEVELS = [
    { id: 'facil', name: 'Fácil', pegs: 3, colors: 4, repeat: false, tries: 8, intro: 'Três cores entre quatro, sem repetir' },
    { id: 'medio', name: 'Médio', pegs: 4, colors: 6, repeat: false, tries: 10, intro: 'Quatro cores entre seis, ainda sem repetir' },
    { id: 'dificil', name: 'Difícil', pegs: 4, colors: 6, repeat: true, tries: 10, intro: 'As mesmas seis cores, mas agora elas podem se repetir' },
    { id: 'muito', name: 'Muito difícil', pegs: 5, colors: 8, repeat: true, tries: 12, intro: 'Cinco cores entre oito, com repetição' },
  ];

  // Resposta clássica, correta com cores repetidas: "no lugar" conta as posições iguais; "fora do lugar"
  // soma, cor a cor, o mínimo entre o que sobrou na senha e o que sobrou na tentativa
  // (cada pino da senha só é contado uma vez). Devolve no lugar * 8 + fora do lugar.
  const cS = new Int8Array(16), cG = new Int8Array(16);
  function scoreKey(secret, guess) {
    cS.fill(0); cG.fill(0);
    let black = 0, white = 0;
    for (let i = 0; i < secret.length; i++) {
      const a = secret[i], b = guess[i];
      if (a === b) black++; else { cS[a]++; cG[b]++; }
    }
    for (let c = 0; c < 16; c++) white += cS[c] < cG[c] ? cS[c] : cG[c];
    return black * 8 + white;
  }
  const score = (secret, guess) => { const k = scoreKey(secret, guess); return { black: k >> 3, white: k & 7 }; };

  // Sorteia a senha com o gerador do nível (mesma semente, mesma senha).
  function generate(rng, lv) {
    if (lv.repeat) return Array.from({ length: lv.pegs }, () => rng.int(lv.colors));
    return rng.shuffle(Array.from({ length: lv.colors }, (_, i) => i)).slice(0, lv.pegs);
  }
  // Quantas senhas o nível permite.
  function total(lv) {
    let n = 1;
    for (let i = 0; i < lv.pegs; i++) n *= lv.repeat ? lv.colors : lv.colors - i;
    return n;
  }
  // Todas as senhas do nível, em ordem.
  function allCodes(lv) {
    const out = [], cur = [], used = [];
    (function rec(i) {
      if (i === lv.pegs) { out.push(cur.slice()); return; }
      for (let c = 0; c < lv.colors; c++) {
        if (!lv.repeat && used[c]) continue;
        cur[i] = c; used[c] = true;
        rec(i + 1);
        used[c] = false;
      }
    })(0);
    return out;
  }
  // Senhas que dariam exatamente as respostas já recebidas. history: [{ guess, black, white }]
  function candidates(codes, history) {
    const keys = history.map(t => t.black * 8 + t.white);
    return codes.filter(c => history.every((t, i) => scoreKey(c, t.guess) === keys[i]));
  }
  // Entre as senhas ainda possíveis, escolhe a que melhor divide as outras (menor pior caso, depois
  // menor média). Com muitas possibilidades, avalia amostras espaçadas (determinísticas) para ser rápido.
  function pickGuess(cands) {
    if (cands.length <= 2) return cands[0] || null;
    const spread = (arr, k) => (arr.length <= k ? arr : Array.from({ length: k }, (_, i) => arr[Math.floor((i + 0.5) * arr.length / k)]));
    const small = cands.length <= 400;
    const G = small ? cands : spread(cands, 120), T = small ? cands : spread(cands, 1500);
    const counts = new Int32Array(64);
    let best = null, bw = Infinity, bs = Infinity;
    for (const g of G) {
      counts.fill(0);
      for (const t of T) counts[scoreKey(t, g)]++;
      let worst = 0, sq = 0;
      for (let i = 0; i < 64; i++) { const c = counts[i]; if (c > worst) worst = c; sq += c * c; }
      if (worst < bw || (worst === bw && sq < bs)) { best = g; bw = worst; bs = sq; }
    }
    return best;
  }
  // Resposta em texto (acessível e sem depender de ver os pinos).
  function fbText(black, white, pegs) {
    if (black === pegs) return `${black} no lugar: senha certa`;
    if (!black && !white) return 'nenhuma cor está na senha';
    return `${black} no lugar, ${white} fora do lugar`;
  }
  const fmtN = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  const lista = a => (a.length < 2 ? a.join('') : `${a.slice(0, -1).join(', ')} e ${a[a.length - 1]}`);

    const L = lum(hex);
    return 1.05 / (L + 0.05) >= (L + 0.05) / (lum('#2A2433') + 0.05) ? '#FFFFFF' : '#2A2433';
  }
  const logic = { LEVELS, scoreKey, score, generate, total, allCodes, candidates, pickGuess, fbText, fmtN, lista, symColor };
  if (typeof module !== 'undefined' && module.exports) { module.exports = logic; return; }

  // ---------- interface ----------
  const STEP = 90, POP = 260;          // revelação dos pinos da resposta (ms)
  const CODES = {};                     // todas as senhas de cada nível (para a dica), calculadas uma vez
  const codesFor = lv => CODES[lv.id] || (CODES[lv.id] = allCodes(lv));
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  const noFocus = e => e.preventDefault();   // clique/toque não prende o foco: Enter continua testando a senha

  // Símbolos das cores desenhados em SVG (mesmo traço em qualquer aparelho); símbolo desconhecido vira texto.
  const SYM = {
    '●': '<circle cx="10" cy="10" r="6.4"/>',
    '▲': '<path d="M10 3.4 17.2 16.1H2.8z"/>',
    '■': '<rect x="4.2" y="4.2" width="11.6" height="11.6" rx="1.4"/>',
    '◆': '<path d="M10 2.4 17.6 10 10 17.6 2.4 10z"/>',
    '★': '<path d="M10 2.5 12.06 7.87 17.8 8.17 13.33 11.78 14.82 17.33 10 14.2 5.18 17.33 6.67 11.78 2.2 8.17 7.94 7.87z"/>',
    '✚': '<path d="M7.7 3h4.6v4.7H17v4.6h-4.7V17H7.7v-4.7H3V7.7h4.7z"/>',
    '♥': '<path d="M10 16.9C4.7 13 2.9 10.3 2.9 7.6c0-2.3 1.7-4 3.9-4 1.5 0 2.6.8 3.2 2 .6-1.2 1.7-2 3.2-2 2.2 0 3.9 1.7 3.9 4 0 2.7-1.8 5.4-7.1 9.3z"/>',
    '⬟': '<path d="M10 2.9 17.51 8.36 14.64 17.19 5.36 17.19 2.49 8.36z"/>',
  };
  const symSvg = s => `<svg viewBox="0 0 20 20" aria-hidden="true">${SYM[s] || `<text x="10" y="15" text-anchor="middle" font-size="14" font-weight="900" stroke="none">${s}</text>`}</svg>`;

  `;

  Jogos.register({
    id: 'senha',
    name: 'Senha secreta',
    tagline: 'Descubra a sequência de cores escondida no cofre.',
    icon: ICON,
    css: CSS,
    generated: true,
    freshRestart: true, // recomeçar sorteia outra senha (quem perdeu já viu a anterior)
    metric: { label: 'Tentativas', unit: ['tentativa', 'tentativas'] },
    levels: LEVELS.map(l => Object.assign({}, l, {
      sub: `<span class="cnt">${l.pegs} posições · </span>${l.colors} cores${l.repeat ? ' · com repetição' : ''}`,
      blurb: `${l.intro}: ${fmtN(total(l))} senhas possíveis.`,
    })),
    rules: lv => [
      { key: 'senha', icon: ICO_SENHA(lv.repeat), novo: lv.id === 'dificil',
        html: `A senha tem <b>${lv.pegs} cores em sequência</b>, escolhidas entre ${lv.colors}` + (lv.repeat ? '. Uma cor <b>pode aparecer mais de uma vez</b>.' : ', <b>sem repetir</b> nenhuma.') },
      { key: 'resposta', icon: ICO_RESP, html: 'Cada <b>pino cheio</b> é uma cor no lugar certo; cada <b>pino vazado</b>, uma cor da senha que está em outro lugar. Os pinos <b>não dizem quais</b> posições são.' },
      { key: 'limite', icon: ICO_LIMITE, html: `Abra o cofre em até <b>${lv.tries} tentativas</b>.` },
    ],
    how: lv => `Toque numa cor para colocá-la no espaço destacado da linha atual. Toque num espaço preenchido para esvaziá-lo, ou num vazio para escolher onde entra a próxima cor. Com a linha completa, toque em <b>Testar senha</b>. No teclado: <b>1</b> a <b>${lv.colors}</b> escolhem as cores, <b>Backspace</b> apaga e <b>Enter</b> testa.`,

    mount(ctx) {
      const { h } = ctx, lv = ctx.level, P = lv.pegs, C = lv.colors, T = lv.tries;
      const plural = ctx.core.plural;
      const COL = ctx.PIECES.slice(0, C);
      const nome = ci => COL[ci].id;
      const secret = generate(ctx.rng, lv);
      const history = [];                  // [{ guess, black, white }]
      let cur = Array(P).fill(null);       // linha em montagem (índices de cor ou null)
      let target = null;                   // espaço vazio escolhido para a próxima cor
      let hinted = false, anim = false, placed = -1, ended = null;
      const bigRow = () => (ended ? history.length - 1 : history.length);
      const nextSlot = () => (target != null && cur[target] == null ? target : cur.indexOf(null));

      ctx.setMoves(0);

      const pegEl = (ci, cls) => h('span', { class: 'sn-peg' + (cls ? ' ' + cls : ''), style: { '--c': COL[ci].fill, '--sy': symColor(COL[ci].fill) }, html: symSvg(COL[ci].sym) });

      // Cofre: faixa da senha escondida + linhas de tentativas (a 1ª embaixo, perto da paleta)
      const wrap = h('div', { class: 'sn-wrap', style: { '--sn-p': P } });
      const cells = Array.from({ length: P }, () => h('span', { class: 'sn-cell' }, h('span', { class: 'sn-cover', 'aria-hidden': 'true' }, '?')));
      const bandSr = h('span', { class: 'sn-sr' }, 'Senha secreta, ainda escondida.');
      const bandLbl = h('span', { class: 'sn-band-lbl', 'aria-hidden': 'true' }, 'Senha secreta');
      const band = h('div', { class: 'sn-band' }, bandSr, h('span', { class: 'sn-num' }), h('span', { class: 'sn-slots' }, cells), h('span', { class: 'sn-lock', html: LOCK }), bandLbl);
      const list = h('ol', { class: 'sn-rows', 'aria-label': 'Tentativas' });
      const rows = Array.from({ length: T }, (_, r) => {
        const o = {
          li: h('li', { class: 'sn-row' }), sr: h('span', { class: 'sn-sr' }), num: h('span', { class: 'sn-num', 'aria-hidden': 'true' }, String(r + 1)),
          slots: h('span', { class: 'sn-slots' }), fb: h('span', { class: 'sn-fb', 'aria-hidden': 'true' }), txt: h('span', { class: 'sn-fbt' }), btns: null,
        };

        list.append(o.li);
        return o;
      });
      const pal = h('div', { class: 'sn-pal', role: 'group', 'aria-label': 'Cores' }, COL.map((p, ci) => h('button', {
        type: 'button', class: 'sn-color', 'aria-keyshortcuts': String(ci + 1), onmousedown: noFocus, onclick: () => pick(ci),
      }, pegEl(ci), h('span', { class: 'sn-key', 'aria-hidden': 'true' }, String(ci + 1)))));
      const palBtns = [...pal.children];
      wrap.append(h('div', { class: 'sn-vault' }, band, list), pal);
      ctx.board.append(wrap);

      // Tamanhos: cabem 5 posições + resposta numa linha a partir de 340px de tela.
      function layout(w) {
        if (!w) return;
        const cs = getComputedStyle(ctx.board);
        const avail = Math.max(240, w - (parseFloat(cs.paddingLeft) || 0) - (parseFloat(cs.paddingRight) || 0));
        const nar = avail < 440;
        const VP = nar ? 4 : 12, RP = nar ? 3 : 6, RX = nar ? 3 : 10, CG = nar ? 5 : 12, NUM = nar ? 14 : 26, TXT = 120;
        const frame = 2 * (VP + 1.6) + 2 * (1.6 + RP) + 2 * (1.6 + RX);
        const inner = Math.min(avail, 660) - frame - 0.5;
        const kc = Math.ceil(P / 2);
        const dim = s => {
          const g = Math.max(5, Math.round(s * 0.2)), k = Math.max(8, Math.min(14, Math.round(s * 0.3))), kg = s >= 38 ? 4 : 3;
          const fbW = kc * k + (kc - 1) * kg;
          return { s, cw: s + g, k, kg, fbW, base: NUM + 2 * CG + P * (s + g) + fbW };
        };
        // Maior pino que cabe; se der, com o texto da resposta visível (aceitando pinos de até 38px).
        const fit = room => { let d = dim(44); for (let s = 44; s > 20 && d.base > room; s--) d = dim(s - 1); return d; };
        let d = fit(inner - CG - TXT);
        const wide = !nar && d.s >= 38 && d.base + CG + TXT <= inner;
        if (!wide) d = fit(inner);
        const textW = wide ? Math.min(210, inner - d.base - CG) : 0;
        const s2 = Math.round(d.s * 0.76);
        const PG = nar ? 6 : 10;
        let pc = C, pb = Math.floor((avail - (C - 1) * PG) / C);

          '--sn-pb': px(pb), '--sn-pg': px(PG), '--sn-pc': pc,

        for (const [k, v] of Object.entries(vars)) wrap.style.setProperty(k, String(v));
        wrap.classList.toggle('sn-wide', wide);
        wrap.classList.toggle('sn-nar', nar);
      }

      function paintRow(r, reveal) {
        const o = rows[r], t = history[r];
        const state = t ? 'past' : r === history.length && !ended ? 'cur' : 'fut';
        o.li.className = `sn-row sn-${state}` + (r === bigRow() ? ' sn-big' : '') + (t && t.black === P ? ' sn-win' : '') + (reveal ? ' sn-anim' : '');
        if (state === 'fut') o.li.setAttribute('aria-hidden', 'true'); else o.li.removeAttribute('aria-hidden');
        if (state === 'cur') o.slots.removeAttribute('aria-hidden'); else o.slots.setAttribute('aria-hidden', 'true');
        o.btns = null;
        o.fb.replaceChildren();
        o.txt.textContent = '';
        o.sr.textContent = '';
        if (state === 'cur') {
          o.btns = Array.from({ length: P }, (_, i) => h('button', { type: 'button', class: 'sn-slot', onmousedown: noFocus, onclick: () => tapSlot(i) }));
          o.slots.replaceChildren(...o.btns);
          o.sr.textContent = `Tentativa ${r + 1} de ${T}, em montagem.`;
          paintCurrent();
        } else if (state === 'past') {
          o.slots.replaceChildren(...t.guess.map(ci => h('span', { class: 'sn-slot' }, pegEl(ci))));
          const kinds = [...Array(t.black).fill('hit'), ...Array(t.white).fill('near'), ...Array(P - t.black - t.white).fill('none')];
          o.fb.replaceChildren(...kinds.map((k, i) => h('span', { class: 'sn-kp sn-' + k, style: { '--i': i } })));

          o.slots.replaceChildren(...Array.from({ length: P }, () => h('span', { class: 'sn-slot' }, h('span', { class: 'sn-hole' }))));

      }

      // Atualiza só a linha atual (os botões continuam os mesmos, então o foco do teclado não se perde).
      function paintCurrent() {
        const o = rows[history.length];
        if (!o || !o.btns) return;
        const nx = nextSlot();
        o.li.classList.toggle('sn-hinted', hinted);
        o.btns.forEach((b, i) => {
          const ci = cur[i];

      function status(action) {
        if (ctx.status !== 'play' || anim) return;
        const n = history.length + 1, falta = cur.filter(x => x == null).length, last = history[history.length - 1];
        const faltam = k => `Falta${k > 1 ? 'm' : ''} ${plural(k, 'cor', 'cores')} nesta linha.`;
        if (falta === P && !action) {
          if (!last) ctx.say('Descubra a senha', `Toque nas cores para montar a primeira tentativa${lv.repeat ? '' : ', sem repetir cores'}.`);

  const CSS = `
  .tr-wrap{position:relative;flex:none;margin:2px auto}

  // Sorteio do desafio: "Recomeçar" (mesma semente) repete o mesmo; "Novo desafio" evita os que saíram há pouco.
  const escolhas = new Map(), recentes = {};
  function sortear(ctx, total) {
    const r = ctx.rng();                                  // consome sempre o mesmo número: cores e frentes não mudam
    const chave = ctx.level.id + ':' + ctx.seed;
    if (escolhas.has(chave)) return escolhas.get(chave);
    const rec = recentes[ctx.level.id] || (recentes[ctx.level.id] = []);
    const livres = [];
    for (let i = 0; i < total; i++) if (!rec.includes(i)) livres.push(i);
    const i = livres.length ? livres[Math.floor(r * livres.length)] : Math.floor(r * total);
    rec.push(i);
    if (rec.length > total / 2) rec.shift();
    escolhas.set(chave, i);
    return i;
  }
  const veiculos = id => { const q = BANCO[id].map(x => parse(x.slice(2)).v.length); return [Math.min(...q), Math.max(...q)]; };

  Jogos.register({
    id: 'transito',
    name: 'Trânsito',
    tagline: 'Deslize carros e caminhões e tire o carro vermelho do pátio lotado.',
    icon: ICON,
    css: CSS,
    metric: { label: 'Movimentos', unit: ['movimento', 'movimentos'] },
    generated: true,
    levels: [
      { id: 'facil', name: 'Fácil', blurb: (lo, hi) => `Poucos bloqueios: dá para sair em ${lo} a ${hi} movimentos.` },
      { id: 'medio', name: 'Médio', blurb: (lo, hi) => `Mais veículos no caminho: a ordem dos movimentos começa a pesar (${lo} a ${hi} movimentos).` },
      { id: 'dificil', name: 'Difícil', blurb: (lo, hi) => `Engarrafamento: abra espaço antes de abrir o caminho (${lo} a ${hi} movimentos).` },
      { id: 'muito', name: 'Muito difícil', blurb: (lo, hi) => `Os pátios mais travados: de ${lo} a ${hi} movimentos na melhor solução.` },
    ].map(l => {
      const [lo, hi] = faixa(l.id), [v0, v1] = veiculos(l.id);
      return Object.assign(l, { blurb: l.blurb(lo, hi), sub: `<span class="cnt">${v0}–${v1} veículos · </span>mín. ${lo}–${hi}` });
    }),
    rules: () => [
      { key: 'eixo', icon: ICO_EIXO, html: 'Cada veículo anda <b>só na sua direção</b>: para a frente e para trás, na horizontal ou na vertical.' },
      { key: 'livre', icon: ICO_LIVRE, html: 'Ele desliza por <b>casas livres</b>: não passa por cima de outro veículo nem atravessa as paredes do pátio.' },
      { key: 'saida', icon: ICO_SAIDA, html: 'Leve o <b>carro vermelho</b>, o da estrela, até a <b>saída</b> na borda direita da 3ª linha.' },
      { key: 'conta', icon: ICO_CONTA, html: '<b>Um movimento</b> é deslizar um veículo quantas casas quiser.' },
    ],
    how: 'Arraste um veículo ao longo da sua direção. Ou toque nele (ou chegue nele com <b>Tab</b>) e depois toque numa casa marcada ou use as <b>setas</b>; <b>Shift</b> + seta desliza até onde der. Mexer no mesmo veículo várias vezes seguidas conta como um só movimento.',

    mount(ctx) {
      const { h } = ctx;
      const lista = BANCO[ctx.level.id];

      const frente = puz.v.map((v, i) => (i === 0 ? 'r' : v.h ? (ctx.rng() < 0.5 ? 'r' : 'l') : (ctx.rng() < 0.5 ? 'u' : 'd')));

      ctx.setMin(min);

      const wrap = h('div', { class: 'tr-wrap' });
      const gridEl = h('div', { class: 'tr-grid', role: 'group', 'aria-label': `Pátio de 6 por 6 com ${n} veículos. A saída fica na borda direita da 3ª linha.` });
      const cells = Array.from({ length: N * N }, (_, c) => h('div', {
        class: 'tr-cell' + (Math.floor(c / N) === SAIDA ? ' lane' : ''), 'data-c': c, style: { '--c': c % N, '--r': Math.floor(c / N) },

      const ghost = h('div', { class: 'tr-ghost', hidden: true });
      const els = puz.v.map((v, i) => h('button', { type: 'button', class: `tr-car ${v.h ? 'hz' : 'vt'}`, 'data-i': i }));
      gridEl.append(...cells, ghost, ...els);
      wrap.append(h('div', { class: 'tr-lot' }, h('div', { class: 'tr-floor' })), h('div', { class: 'tr-exit', 'aria-hidden': 'true', html: SETA }), gridEl);
      ctx.board.append(wrap);

      const caixa = (v, cell, g) => [(v.h ? v.len : 1) * cell - 2 * g, (v.h ? 1 : v.len) * cell - 2 * g];
      ctx.onResize(w => {
        const cs = getComputedStyle(ctx.board);
        const inner = w - (parseFloat(cs.paddingLeft) || 0) - (parseFloat(cs.paddingRight) || 0);
        const celula = (fr, ex) => Math.max(30, Math.min(66, Math.floor((inner - 2 * fr - ex) / N)));
        let cell = 48, fr = 8, ex = 24;
        for (let k = 0; k < 3; k++) {

          fr = Math.round(Math.min(12, Math.max(6, cell * 0.16)));
          ex = Math.round(Math.min(34, Math.max(16, cell * 0.5)));

        cell = celula(fr, ex);

        wrap.style.width = 6 * cell + 2 * fr + ex + 'px';
        wrap.style.height = 6 * cell + 2 * fr + 'px';
        els.forEach((el, i) => {
          const [W, H] = caixa(puz.v[i], cell, g);

          el.style.height = H + 'px';
          el.style.borderRadius = Math.round((cell - 2 * g) * 0.26) + 'px';

      const setXY = (i, p) => {

        return `${cap(nome(i))}, ${v.h ? 'horizontal' : 'vertical'}, ${onde}${i === 0 ? '. Leve-o até a saída, à direita da linha 3' : ''}`;
      }
      const livre = () => { const g = grid(puz, pos); for (let c = pos[0] + 2; c < N; c++) if (g[SAIDA * N + c] >= 0) return false; return true; };

      function render() {
        if (!L) return;
        const g = grid(puz, pos);
        els.forEach((el, i) => {

        }
        cells.forEach((el, c) => el.classList.toggle('reach', reach.has(c)));
        travado = sel != null && !reach.size;
        ghost.hidden = !hint;
        if (hint) {
          const v = puz.v[hint.i], [W, H] = caixa(v, L.cell, L.g);
          ghost.style.setProperty('--x', v.h ? hint.to : v.fixed);
          ghost.style.setProperty('--y', v.h ? v.fixed : hint.to);
          ghost.style.width = W + 'px';
          ghost.style.height = H + 'px';
        }
        ctx.controls({ undo: hist.length > 0 && !busy });
        status();
      }
      function status() {
        if (ctx.status !== 'play' || busy) return;
        if (sel != null) {
          const v = puz.v[sel];
          return ctx.say(`${cap(nome(sel))} selecionado`, travado
            ? 'Ele está travado agora: primeiro abra espaço movendo outro veículo.'
            : `Toque em uma casa marcada ou use as setas ${v.h ? '← e →' : '↑ e ↓'} para deslizá-lo.`);
        }
        if (!moves) return ctx.say('Sua vez', 'Arraste os veículos para abrir caminho e leve o carro vermelho até a saída, à direita.');
        if (livre()) return ctx.say('Caminho livre!', 'Agora leve o carro vermelho até a saída.');
        ctx.say('Continue', 'Abra caminho até a saída para o carro vermelho.');
      }

      // Um movimento = deslizar um veículo. Mexer de novo no mesmo veículo, logo em seguida, continua o
      // mesmo movimento (e, se ele voltar para onde estava, o movimento some).
      function mover(i, to) {
        const from = pos[i];
        if (to === from) return render();
        pos[i] = to;
        const ult = hist[hist.length - 1];
        if (ult && ult.i === i) {
          ult.to = to;
          if (ult.to === ult.from) { hist.pop(); moves--; }
        } else { hist.push({ i, from, to }); moves++; }
        hint = null;
        if (ctx.clearHint) ctx.clearHint();              // o contador pode não mudar (mesmo veículo): limpa à mão
        if (ctx.clearWarn) ctx.clearWarn();
        ctx.setMoves(moves);
        render();
        if (solved(pos)) vitoria();
      }
      // Vitória: o vermelho encostou na saída; ele atravessa a abertura, some e só então o kit comemora.
      function vitoria() {
        busy = true; sel = null; hint = null;
        ctx.busy(true);
        wrap.classList.add('fim');
        render();
        ctx.say('Saída livre!', 'O carro vermelho está deixando o pátio.');
        const fim = () => { busy = false; ctx.busy(false); ctx.win(); };
        if (ctx.reduced) { saiu = true; els[0].classList.add('gone'); ctx.later(fim, 150); return; }
        ctx.later(() => {
          saiu = true;
          els[0].classList.add('out');
          setXY(0, N + 2);
          ctx.later(fim, 650);
        }, 200);
      }
      function avisoEixo(i) {
        ctx.retrigger(els[i]);
        ctx.warn('Essa direção não vale', `O ${nome(i)} só anda na ${puz.v[i].h ? 'horizontal (← e →)' : 'vertical (↑ e ↓)'}.`, 'eixo');
      }
      function bloqueado(i, dir) {
        const v = puz.v[i], q = dir < 0 ? pos[i] - 1 : pos[i] + v.len;
        ctx.retrigger(els[i]);
        if (q < 0 || q >= N) return ctx.warn('Fim do pátio', `O ${nome(i)} já está encostado na borda.`, 'livre');

      // --- arrastar (pointer events, só no eixo do veículo, encaixando nas casas) ---
      function soltar() {
        if (!drag) return;
        const d = drag;
        drag = null;
        d.el.classList.remove('drag');

          drag.el.classList.add('drag');

          render();

        drag.f = Math.max(drag.lo, Math.min(drag.hi, drag.p0 + (v.h ? dx : dy) / L.cell));

      });
      const fimArrasto = (e, cancelou) => {
        if (!drag || e.pointerId !== drag.id) return;
        const d = drag;
        drag = null;
        d.el.classList.remove('drag');
        if (!d.moved) {                                    // toque: seleciona (ou tira a seleção)

        }
        const to = cancelou ? d.p0 : Math.round(d.f);

      };
      ctx.listen(gridEl, 'pointerup', e => fimArrasto(e, false));
      ctx.listen(gridEl, 'pointercancel', e => fimArrasto(e, true));
      ctx.listen(gridEl, 'lostpointercapture', e => fimArrasto(e, false));

      // --- tocar numa casa marcada leva o veículo selecionado até ela ---
      ctx.listen(gridEl, 'click', e => {
        const cel = e.target.closest && e.target.closest('.tr-cell');

      });

      ctx.listen(gridEl, 'focusin', e => {

      });

      return {

          const dir = v.h ? (m.to > m.from ? 'para a direita' : 'para a esquerda') : (m.to > m.from ? 'para baixo' : 'para cima');

          render();
          const resto = sol.dist === 1 ? 'Daqui, falta só este movimento.' : `Daqui, faltam ${sol.dist} movimentos.`;

        },
        onUndo() {
          if (busy) return;
          soltar();
          const ult = hist.pop();
          if (!ult) return;
          pos[ult.i] = ult.from;
          moves--;
          hint = null;
          if (ctx.clearHint) ctx.clearHint();
          ctx.setMoves(moves);
          render();
        },
      };
    },
  });
})();


/* ===== luzes ===== */
/* Luzes — cada toque inverte uma lâmpada e as vizinhas; apague todas */
(() => {
  // ---------- lógica pura (testável no Node) ----------
  // Tabuleiro: array com n*n posições, linha a linha; 1 = acesa, 0 = apagada.
  const K = typeof JogosCore !== 'undefined' ? JogosCore : require('../kit-core.js');

  // taps: quantos toques distintos são sorteados a partir do tabuleiro apagado.
  // minFloor: mínimo aceito. No 4×4 e no 5×5 alguns sorteios têm atalhos (soluções mais curtas
  // que os toques usados) e ficariam fáceis demais para o nível; esses são sorteados de novo.
  const LEVELS = [
    { id: 'facil', name: 'Fácil', n: 3, taps: [3, 4], minFloor: 3, blurb: 'Grade 3×3 para pegar o jeito.' },
    { id: 'medio', name: 'Médio', n: 4, taps: [5, 6], minFloor: 4, blurb: 'Grade 4×4: às vezes o caminho mais curto não é o mais óbvio.' },
    { id: 'dificil', name: 'Difícil', n: 5, taps: [8, 9], minFloor: 8, blurb: 'Grade 5×5, o tamanho do brinquedo clássico.' },
    { id: 'muito', name: 'Muito difícil', n: 6, taps: [11, 13], minFloor: 11, blurb: 'Grade 6×6: 36 lâmpadas e soluções longas.' },
  ];

  // Posições que um toque em i inverte: ela mesma e as vizinhas de cima, de baixo, da esquerda e da direita.
  function neighborsOf(n, i) {
    const r = Math.floor(i / n), c = i % n, out = [i];
    if (r > 0) out.push(i - n);
    if (r < n - 1) out.push(i + n);
    if (c > 0) out.push(i - 1);
    if (c < n - 1) out.push(i + 1);
    return out;
  }
  function press(board, n, i) {
    const b = board.slice();
    for (const j of neighborsOf(n, i)) b[j] ^= 1;
    return b;
  }
  const litCount = board => board.reduce((s, v) => s + v, 0);

  // Sistema A·x = b em GF(2): A[r][j] = 1 se tocar em j inverte r (A é simétrica), b = lâmpadas acesas,
  // x = lâmpadas a tocar. Escalonamos [A | I] uma vez por tamanho (Gauss-Jordan): T·A = R, com R na forma
  // escalonada reduzida. Guardamos T, as colunas-pivô e uma base do espaço nulo de A (toques que não mudam nada).
  const systems = {};
  function system(n) {
    if (systems[n]) return systems[n];
    const N = n * n, M = [];
    for (let r = 0; r < N; r++) {
      const row = new Uint8Array(2 * N);
      for (const j of neighborsOf(n, r)) row[j] = 1;
      row[N + r] = 1;
      M.push(row);
    }
    const piv = [], free = [];
    let rank = 0;
    for (let c = 0; c < N; c++) {
      let p = rank;
      while (p < N && !M[p][c]) p++;
      if (p === N) { free.push(c); continue; }        // coluna livre: gera uma direção do espaço nulo
      [M[rank], M[p]] = [M[p], M[rank]];
      const P = M[rank];
      for (let r = 0; r < N; r++) {
        if (r === rank || !M[r][c]) continue;
        const R = M[r];
        for (let k = c; k < 2 * N; k++) R[k] ^= P[k];  // antes da coluna c a linha-pivô só tem zeros
      }
      piv.push(c);
      rank++;
    }
    const T = M.map(row => row.slice(N));
    const basis = free.map(f => {
      const v = new Uint8Array(N);
      v[f] = 1;
      for (let k = 0; k < rank; k++) if (M[k][f]) v[piv[k]] = 1;
      return v;
    });
    return (systems[n] = { N, rank, piv, T, basis });
  }

  // Menor conjunto de toques que apaga o tabuleiro: uma solução particular somada a cada combinação da base
  // do espaço nulo (16 no 4×4, 4 no 5×5; o 3×3 e o 6×6 têm solução única) — fica a de menos toques.
  // Devolve as posições em ordem crescente, ou null se o tabuleiro não tiver solução.
  function solve(board, n) {
    const { N, rank, piv, T, basis } = system(n);
    const rhs = new Uint8Array(N);
    for (let r = 0; r < N; r++) {
      const t = T[r];
      let s = 0;
      for (let k = 0; k < N; k++) if (t[k] && board[k]) s ^= 1;
      rhs[r] = s;
    }
    for (let r = rank; r < N; r++) if (rhs[r]) return null;   // equação 0 = 1: sem solução
    const x0 = new Uint8Array(N);
    for (let k = 0; k < rank; k++) x0[piv[k]] = rhs[k];
    let best = null, bestW = Infinity;
    for (let mask = 0; mask < 1 << basis.length; mask++) {
      const x = x0.slice();
      basis.forEach((v, b) => { if ((mask >> b) & 1) for (let k = 0; k < N; k++) x[k] ^= v[k]; });
      let w = 0;
      for (let k = 0; k < N; k++) w += x[k];
      if (w < bestW) { bestW = w; best = x; }
    }
    const out = [];
    for (let k = 0; k < N; k++) if (best[k]) out.push(k);
    return out;
  }

  // Sorteia um desafio aplicando toques distintos ao tabuleiro apagado (por isso sempre tem solução).
  // Descarta sorteios que voltam ao tabuleiro apagado e os que ficam abaixo do mínimo do nível.
  function generate({ n, taps, minFloor = 1 }, rng) {
    const N = n * n, cells = Array.from({ length: N }, (_, i) => i);
    let fallback = null;
    for (let tries = 0; tries < 300; tries++) {
      const k = rng.range(taps[0], taps[1]);
      const chosen = rng.shuffle(cells).slice(0, k).sort((a, b) => a - b);
      let board = new Array(N).fill(0);
      for (const c of chosen) board = press(board, n, c);
      if (!litCount(board)) continue;
      const solution = solve(board, n);
      const game = { board, taps: chosen, min: solution.length, solution };
      if (game.min >= minFloor) return game;
      if (!fallback || game.min > fallback.min) fallback = game;
    }
    if (fallback) return fallback;
    const c = Math.floor(N / 2), board = press(new Array(N).fill(0), n, c);

  }

  const logic = { LEVELS, neighborsOf, press, litCount, system, solve, generate };
  if (typeof module !== 'undefined' && module.exports) { module.exports = logic; return; }

  // ---------- interface ----------
  const ON = '#FFC83D', OFF = '#8792A4';
  // Grade 3×3 em SVG; `lit` diz quais estão acesas (linha a linha). Brilho = retângulo claro atrás das acesas.

    let out = '';
    lit.forEach((on, i) => {

    });
    lit.forEach((on, i) => {
      const [x, y] = pos(i);
      out += `<rect x="${f(x)}" y="${f(y)}" width="${s}" height="${s}" rx="${rx}" fill="${on ? ON : OFF}"/>`;
      if (shine) out += `<rect x="${f(x + s * 0.18)}" y="${f(y + s * 0.16)}" width="${f(s * 0.34)}" height="${f(s * 0.2)}" rx="${f(s * 0.1)}" fill="#FFFFFF" opacity="${on ? 0.75 : 0.28}" stroke="none"/>`;
    });

  }
  const ICON = `<svg viewBox="0 0 64 64" aria-hidden="true"><g stroke="#2A2433" stroke-width="1.6" stroke-linejoin="round">
    <rect x="4" y="4" width="56" height="56" rx="13" fill="#3B4454"/>
    ${miniGrid([0, 1, 0, 1, 1, 0, 0, 0, 1], { x0: 9, s: 13, gap: 3.5, rx: 3.5, glow: 3, shine: true })}</g></svg>`;

  const TAP_DOT = (cx, cy) => `<circle cx="${cx}" cy="${cy}" r="2" fill="#2A2433" stroke="none"/>`;
  const ICO_TOQUE = `<svg viewBox="0 0 34 34"><g stroke="#2A2433" stroke-width="1.6" stroke-linejoin="round">${miniGrid([0, 1, 0, 1, 1, 1, 0, 1, 0], SMALL)}${TAP_DOT(17, 17)}</g></svg>`;
  const ICO_BORDA = `<svg viewBox="0 0 34 34"><g stroke="#2A2433" stroke-width="1.6" stroke-linejoin="round">${miniGrid([1, 1, 0, 1, 0, 0, 0, 0, 0], SMALL)}${TAP_DOT(6.5, 6.5)}</g></svg>`;
  const ICO_META = `<svg viewBox="0 0 34 34"><g stroke="#2A2433" stroke-width="1.6" stroke-linejoin="round">${miniGrid([0, 0, 0, 0, 0, 0, 0, 0, 0], SMALL)}</g>

    <path d="M9 17.5l5.5 5.5L26 11" fill="none" stroke="#3FA66B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

  const DARK = '--lz-off:#3B4555;--lz-off-top:rgba(255,255,255,.09);--lz-glow:rgba(255,182,46,.85);--lz-glow-k:.38;--lz-glow-s:2px;--lz-ring:#FFD35A';
  const CSS = `

  :root[data-theme="dark"] .lz-wrap{${DARK}}
  .lz-grid{display:flex;flex-direction:column;isolation:isolate;padding:var(--lz-pad,6px);border-radius:calc(var(--lz-cell,40px) * .3 + var(--lz-pad,6px));background:var(--board-2);border:1.6px solid var(--board-line);transition:border-color .3s,box-shadow .3s}
  .lz-grid.won{border-color:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 20%,transparent)}
  .lz-row{display:flex}
  .lz-lamp{position:relative;flex:none;width:var(--lz-cell,40px);height:var(--lz-cell,40px);margin:0;padding:0;border:0;border-radius:28%;background:none;color:inherit;font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}

  .lz-bulb::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at 50% 46%,rgba(255,253,236,.95) 0,rgba(255,238,160,.6) 28%,rgba(255,222,110,0) 64%);opacity:0;transition:opacity .2s ease var(--lz-d,0ms)}

  .lz-lamp.on .lz-bulb{background-color:var(--lz-on);box-shadow:inset 0 -4px 0 var(--lz-on-low),inset 0 3px 0 var(--lz-on-top),0 0 calc(var(--lz-cell,40px) * var(--lz-glow-k,.22)) var(--lz-glow-s,1px) var(--lz-glow)}

  const WAVE_MS = 70;                                 // atraso da onda nas vizinhas
  const NOTES = {
    base: 'Toque numa lâmpada para inverter ela e as vizinhas.',
    up: 'Acender algumas luzes às vezes faz parte do caminho. Continue.',

    id: 'luzes',
    name: 'Luzes',
    tagline: 'Cada toque inverte a lâmpada e as vizinhas. Apague todas as luzes.',

    css: CSS,
    metric: { label: 'Toques', unit: ['toque', 'toques'] },

    levels: LEVELS.map(l => Object.assign({}, l, { sub: `<span class="cnt">${l.n}×${l.n} · </span>mín. ${l.minFloor}–${l.taps[1]}` })),
    rules: () => [
      { key: 'toque', icon: ICO_TOQUE, html: 'Tocar numa lâmpada <b>inverte ela e as vizinhas</b> de cima, de baixo e dos lados: a acesa apaga e a apagada acende.' },
      { key: 'borda', icon: ICO_BORDA, html: 'Nas bordas e nos cantos há <b>menos vizinhas</b>. As diagonais nunca mudam.' },
      { key: 'meta', icon: ICO_META, html: '<b>Apague todas</b> as luzes, de preferência com o mínimo de toques.' },
    ],
    how: 'Toque ou clique numa lâmpada. No teclado, use as <b>setas</b> para escolher e <b>Enter</b> ou <b>Espaço</b> para tocar. A ordem dos toques não importa, e dois toques na mesma lâmpada se anulam. <b>Estratégia:</b> de cima para baixo, toque logo abaixo de cada luz acesa; as luzes vão descendo até a última linha.',

    mount(ctx) {

      const game = generate(lv, ctx.rng);
      const board = game.board.slice();
      const history = [];
      let moves = 0, hint = -1, cursor = 0, ending = false, note = 'base';
      ctx.setMin(game.min);

      // Grade acessível: role=grid, uma linha por role=row, cada lâmpada é um botão (tabindex móvel).

          const i = r * n + c;
          const el = h('button', { type: 'button', class: 'lz-lamp', role: 'gridcell', tabindex: i === cursor ? '0' : '-1', onclick: () => tap(i) },

        }

/* Sudoku — preencha a grade sem repetir números na linha, na coluna ou no bloco */

  // Técnicas, da mais fácil para a mais difícil (usadas para classificar os desafios):
  // 1 = número com um só lugar no bloco; 2 = com um só lugar na linha ou coluna; 3 = casa com um só candidato;
  // 4 = técnicas com candidatos (alinhamentos, pares e trios). 9 = travaria sem chute.

  // tries: desafios sorteados, no máximo, até achar um que sirva; sym: tira os números aos pares, simétricos pelo
  // centro (visual clássico). Com 36 casas e simetria, o total de dados é sempre par.
  const LEVELS = [
    { id: 'facil', name: 'Fácil', n: 4, br: 2, bc: 2, clues: [6, 6], max: 3, tries: 30, sym: true,
      blurb: 'Grade 4×4 para aquecer: números de 1 a 4.' },
    { id: 'medio', name: 'Médio', n: 6, br: 2, bc: 3, clues: [12, 12], max: 3, tries: 30, sym: true,
      blurb: 'Grade 6×6, com blocos de 2 linhas por 3 colunas.' },
    { id: 'dificil', name: 'Difícil', n: 9, br: 3, bc: 3, clues: [30, 32], max: 3, want: 2, tries: 30, sym: true,
      blurb: 'O clássico 9×9, resolvível sem chutar: procure onde cada número só pode ficar.' },
    { id: 'muito', name: 'Muito difícil', n: 9, br: 3, bc: 3, clues: [23, 26], max: 4, want: 4, tries: 60, sym: false,
      blurb: 'Poucos números dados: anote candidatos e procure pares e alinhamentos.' },

  const geos = {};
  function geometry(n, br, bc) {

  function fullGrid(g, rng) {

      for (let j = 0; j < k; j++) {

        if (p < bp) { bp = p; bj = j; bm = m; if (p < 2) break; }

  // Sorteia um desafio do nível L. Só usa `rng` (e nunca o relógio): a mesma semente gera o mesmo desafio.

      const { puz, clues } = dig(solution, g, rng, rng.range(L.clues[0], L.clues[1]), L.sym);
      const r = rate(puz, g, L.max);

  }

  // Casas com número repetido na linha, na coluna ou no bloco (1 = em conflito).
  function conflicts(vals, g) {

      for (const i of cells) {

        if (seen[d] != null) { bad[i] = 1; bad[seen[d]] = 1; } else seen[d] = i;
      }
    }

  }
  // Onde o número da casa i se repete: 'linha', 'coluna', 'bloco' ou null.
  function clashUnit(vals, g, i) {
    const d = vals[i], us = [g.row[i], g.n + g.col[i], 2 * g.n + g.box[i]];
    if (!d) return null;

          let cls = 'sd-cell' + (given[i] ? ' sd-given' : v ? ' sd-user' : '');
          if (i === sel) cls += ' sd-sel';
          else if (sv && v === sv) cls += ' sd-same';
          else if (sel >= 0 && (g.row[i] === g.row[sel] || g.col[i] === g.col[sel] || g.box[i] === g.box[sel])) cls += ' sd-peer';
          if (bad[i]) cls += ' sd-bad';
          if (i === hinted) cls += ' sd-hinted';
          if (el.classList.contains('sd-shake')) cls += ' sd-shake';
          if (el.className !== cls) el.className = cls;
          paint(i, sv);
          el.tabIndex = i === (sel >= 0 ? sel : firstEmpty) ? 0 : -1;
          const label = `Linha ${g.row[i] + 1}, coluna ${g.col[i] + 1}: ` + (v ? `${v}${given[i] ? ', número dado' : ''}${bad[i] ? ', repetido' : ''}`
            : notes[i] ? `vazia, notas ${digitsOf(notes[i]).join(', ')}` : 'vazia');
          if (el.getAttribute('aria-label') !== label) el.setAttribute('aria-label', label);
        }
        keys.forEach((b, k) => {
          const full = count[k + 1] >= n;
          b.classList.toggle('sd-done', full);
          b.setAttribute('aria-label', `${notesMode ? 'Anotar' : 'Escrever'} ${k + 1}${full ? ' (já tem todos)' : ''}`);
        });
        btnNotes.setAttribute('aria-pressed', String(notesMode));
        pad.classList.toggle('sd-notes', notesMode);
        ctx.controls({ undo: hist.length > 0 });
        status(bad);
      }

      // Mensagem base: quantas casas faltam e o que fazer agora.
      function status(bad) {
        if (ctx.status !== 'play') return;
        let left = 0, nBad = 0;
        for (let i = 0; i < N; i++) { if (!vals[i]) left++; if (bad[i]) nBad++; }
        if (!left) {
          if (nBad) ctx.say('Grade cheia, mas com repetições', 'Os números em vermelho se repetem na linha, na coluna ou no bloco. Troque-os para terminar.');
          return;
        }
        let d;
        if (sel < 0) d = 'Toque em uma casa vazia e escolha um número.';
        else if (given[sel]) d = `Esse ${vals[sel]} veio pronto; os outros ${vals[sel]} da grade ficam destacados. Escolha uma casa vazia para escrever.`;
        else if (vals[sel]) d = notesMode ? 'Esta casa já tem número: apague-o para anotar, ou desligue as Notas para trocar.' : 'Toque em outro número para trocar, ou em Apagar.';
        else if (notesMode) d = 'Notas ligadas: toque nos números para anotar as possibilidades desta casa.';
        else d = `Escolha um número de 1 a ${n} para esta casa.`;
        if (nBad) d = 'Há números repetidos, em vermelho. ' + d;
        ctx.say(left === 1 ? 'Falta 1 casa' : `Faltam ${left} casas`, d);
      }

      function select(i, focus) {
        if (ctx.status !== 'play') return;
        if (i !== sel) { sel = i; render(); }
        if (focus && document.activeElement !== cells[i]) cells[i].focus();
      }
      const shake = i => ctx.retrigger(cells[i], 'sd-shake', 400);
      const change = (i, v1, n1) => ({ i, v0: vals[i], n0: notes[i], v1, n1 });
      // Aplica uma jogada (várias casas de uma vez, para o Desfazer voltar tudo junto).
      function commit(ch, hint) {
        for (const c of ch) { vals[c.i] = c.v1; notes[c.i] = c.n1; }
        hist.push({ ch, sel });
        hinted = hint ? ch[0].i : -1;
        if (!hint && ctx.clearHint) ctx.clearHint();
        render();
      }
      // Escreve d na casa selecionada; ao escrever, apaga as notas de d na linha, coluna e bloco.
      function placeChanges(i, d) {
        const bit = 1 << (d - 1), ch = [change(i, d, 0)];
        for (const p of g.peers[i]) if (notes[p] & bit) ch.push(change(p, vals[p], notes[p] & ~bit));
        return ch;
      }
      function blocked() {
        shake(sel);
        ctx.warn('Número dado', 'Os números que vieram no desafio não mudam. Escolha uma casa vazia.', 'dados');
      }
      function write(d, asNote) {
        if (ctx.status !== 'play') return;
        if (d > n) return ctx.warn(`Só vale de 1 a ${n}`, `Nesta grade entram apenas os números de 1 a ${n}.`);
        if (sel < 0) return ctx.warn('Escolha uma casa', 'Toque em uma casa vazia da grade e depois no número.');
        if (given[sel]) return blocked();
        const i = sel;
        if (asNote) {
          if (vals[i]) { shake(i); return ctx.warn('Casa preenchida', 'Apague o número desta casa antes de anotar possibilidades.'); }
          return commit([change(i, 0, notes[i] ^ (1 << (d - 1)))]);
        }
        if (vals[i] === d) return;
        if (d !== sol[i]) mistakes++;
        commit(placeChanges(i, d));
        const clash = clashUnit(vals, g, i);
        if (clash) {
          shake(i);
          ctx.warn('Número repetido', `Já existe um ${d} ${clash === 'bloco' ? 'neste bloco' : 'nesta ' + clash}. Os repetidos ficam em vermelho.`, clash);
        } else checkWin();
      }
      function erase() {
        if (ctx.status !== 'play') return;
        if (sel < 0) return ctx.warn('Escolha uma casa', 'Toque na casa que você quer apagar.');
        if (given[sel]) return blocked();
        if (vals[sel] || notes[sel]) commit([change(sel, 0, 0)]);
      }
      function toggleNotes() {
        if (ctx.status !== 'play') return;
        notesMode = !notesMode;
        render();
      }
      // Grade cheia e sem repetições é uma solução (a do desafio é única).
      function checkWin() {
        if (vals.includes(0) || conflicts(vals, g).includes(1)) return;
        done = true; sel = -1; hinted = -1;
        render();
        grid.classList.add('sd-won');
        ctx.win({ score: secs, perfect: !hints && !mistakes,
          text: `Você completou a grade em ${ctx.core.fmtTime(secs)}${mistakes ? '' : ', sem errar nenhum número'}.` });
      }

      // Relógio: conta só enquanto a página está visível e o jogo não acabou.
      ctx.every(() => {
        if (done || ctx.status !== 'play' || document.hidden) return;
        secs++;
        ctx.setMoves(secs);
      }, 1000);

      ctx.listen(window, 'keydown', e => {
        if (e.ctrlKey || e.metaKey || e.altKey || ctx.status !== 'play') return;
        const t = e.target;
        if (t && t.closest && t.closest('input, textarea, select, [contenteditable]')) return;
        const k = e.key, code = /^(?:Digit|Numpad)([1-9])$/.exec(e.code || '');
        const dir = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[k];
        if (e.repeat && !dir) return;
        if (/^[1-9]$/.test(k)) { e.preventDefault(); return write(+k, notesMode); }
        if (code && e.shiftKey) { e.preventDefault(); return write(+code[1], !notesMode); }   // Shift + número: o outro modo
        if (k === 'Backspace' || k === 'Delete') { e.preventDefault(); return erase(); }
        if (k === 'n' || k === 'N') { e.preventDefault(); return toggleNotes(); }
        if (dir) {
          if (t && t !== document.body && t !== document.documentElement && !ctx.board.contains(t)) return;
          e.preventDefault();
          if (sel < 0) return select(firstEmpty, true);
          const r = Math.min(n - 1, Math.max(0, g.row[sel] + dir[0])), c = Math.min(n - 1, Math.max(0, g.col[sel] + dir[1]));
          return select(r * n + c, true);
        }
        if (k === 'Escape' && sel >= 0) { sel = -1; render(); }
      });

      render();

      return {
        onHint() {
          if (ctx.status !== 'play') return;
          const H = findHint(vals, sol, g, sel);
          if (!H) return;
          hints++;
          sel = H.i;
          commit(placeChanges(H.i, H.d), true);
          ctx.hint(H.title, H.text);
          ctx.later(() => { if (hinted === H.i) { hinted = -1; render(); } }, 1600);
          checkWin();
        },
        onUndo() {
          const last = hist.pop();
          if (!last) return;
          for (const c of last.ch) { vals[c.i] = c.v0; notes[c.i] = c.n0; }
          sel = last.sel;
          hinted = -1;
          if (ctx.clearHint) ctx.clearHint();
          render();
        },
      };
    },
  });
})();


/* ===== deslizante ===== */
/* Quebra-cabeça deslizante — deslize as peças pelo espaço vazio até deixá-las em ordem */
(() => {
  // ---------- lógica pura (testável no Node) ----------
  // Quadro 3×3: b[c] = número da peça na casa c (casas 0 a 8, da esquerda para a direita, de cima para baixo); 0 é o vazio.
  // 1 movimento = uma peça deslizada uma casa. As distâncias exatas saem de uma busca em largura feita uma vez,
  // a partir do quadro arrumado, sobre as 181.440 posições alcançáveis (tabela de 9! bytes indexada pelo posto da permutação).
  const N = 3, CELLS = N * N;
  const GOAL = [1, 2, 3, 4, 5, 6, 7, 8, 0];
  const FACT = [1, 1, 2, 6, 24, 120, 720, 5040, 40320, 362880];
  const FAR = 255;                                   // na tabela: posição que não dá para arrumar
  // Faixas de mínimo por nível. No Muito difícil há só 223 posições (221 com 30 e 2 com 31): sorteia entre elas com peso igual.
  const LEVELS = {
    facil: { lo: 8, hi: 12 }, medio: { lo: 16, hi: 20 }, dificil: { lo: 24, hi: 28 }, muito: { lo: 30, hi: 31, porEstado: true },
  };
  const ADJ = Array.from({ length: CELLS }, (_, c) => {
    const r = Math.floor(c / N), k = c % N, a = [];
    if (r > 0) a.push(c - N);
    if (k > 0) a.push(c - 1);
    if (k < N - 1) a.push(c + 1);
    if (r < N - 1) a.push(c + N);
    return a;
  });

  // Posto de Lehmer da permutação (0 .. 9!-1) e o caminho inverso.
  // Da direita para a esquerda: `mask` guarda os números já vistos; POP conta quantos são menores que o atual.
  const POP = new Uint8Array(1 << CELLS);
  for (let m = 1; m < POP.length; m++) POP[m] = POP[m >> 1] + (m & 1);
  function rank(b) {
    let mask = 0, r = 0;
    for (let i = CELLS - 1; i >= 0; i--) {
      const v = b[i];
      r += POP[mask & ((1 << v) - 1)] * FACT[CELLS - 1 - i];
      mask |= 1 << v;
    }
    return r;
  }
  function unrankInto(r, b, used) {
    used.fill(0);
    for (let i = 0; i < CELLS; i++) {
      const f = FACT[CELLS - 1 - i];
      let s = Math.floor(r / f);
      r -= s * f;
      for (let v = 0; v < CELLS; v++) if (!used[v] && s-- === 0) { b[i] = v; used[v] = 1; break; }
    }
    return b;
  }
  const unrank = r => unrankInto(r, new Array(CELLS), new Uint8Array(CELLS));

  // Tabela de distâncias até o quadro arrumado (feita uma vez, sob demanda; ~20 ms no Node).
  // A fila guarda cada quadro compactado em 32 bits (casas 0–7, 4 bits cada; a casa 8 é o número que falta).
  let DIST = null, COUNTS = null;
  function table() {
    if (DIST) return DIST;
    const dist = new Uint8Array(FACT[CELLS]).fill(FAR);
    const queue = new Uint32Array(FACT[CELLS] / 2);  // metade das permutações é alcançável
    const b = GOAL.slice(), counts = [];
    const pack = () => { let p = 0; for (let i = 0; i < CELLS - 1; i++) p |= b[i] << (4 * i); return p; };
    let head = 0, tail = 0;
    dist[rank(GOAL)] = 0;
    queue[tail++] = pack();
    for (let d = 0; head < tail; d++) {            // uma camada da busca por vez: todas com distância d
      const end = tail;
      counts[d] = end - head;
      while (head < end) {
        const p = queue[head++];
        let sum = 0, z = CELLS - 1;
        for (let i = 0; i < CELLS - 1; i++) { const v = (p >>> (4 * i)) & 15; b[i] = v; sum += v; if (!v) z = i; }
        b[CELLS - 1] = (CELLS * (CELLS - 1)) / 2 - sum;
        for (const n of ADJ[z]) {
          b[z] = b[n]; b[n] = 0;
          const rn = rank(b);
          if (dist[rn] === FAR) { dist[rn] = d + 1; queue[tail++] = pack(); }
          b[n] = b[z]; b[z] = 0;
        }
      }
    }

    COUNTS = counts;
    return dist;
  }
  const counts = () => { table(); return COUNTS.slice(); };
  // Menor número de movimentos até arrumar; -1 se a posição não tem solução.
  function distance(b) { const d = table()[rank(b)]; return d === FAR ? -1 : d; }
  const isSolved = b => b.every((t, i) => t === GOAL[i]);
  // Largura ímpar: tem solução se o número de inversões entre as peças for par.
  function solvable(b) {
    let inv = 0;
    for (let i = 0; i < CELLS; i++) for (let j = i + 1; j < CELLS; j++) if (b[i] && b[j] && b[i] > b[j]) inv++;
    return inv % 2 === 0;
  }
  // Sentido em que anda a peça que sai da casa `from` para a casa `to`.
  const dirOf = (from, to) => (to - from === -N ? 'cima' : to - from === N ? 'baixo' : to - from === -1 ? 'esquerda' : 'direita');

  // Tocar na casa `cell`: se estiver na linha ou coluna do vazio, as peças entre ela e o vazio andam uma casa na direção dele.
  function slide(b, cell) {
    const z = b.indexOf(0);
    if (cell === z || cell < 0 || cell >= CELLS) return null;
    let step;
    if (Math.floor(cell / N) === Math.floor(z / N)) step = cell > z ? 1 : -1;
    else if (cell % N === z % N) step = cell > z ? N : -N;
    else return null;
    const nb = b.slice(), moved = [];
    for (let p = z; p !== cell; p += step) { nb[p] = nb[p + step]; moved.push(nb[p]); }
    nb[cell] = 0;
    return { board: nb, moved, count: moved.length, from: z, to: cell, dir: dirOf(z + step, z) };
  }

  // Próximo movimento de uma solução ótima: { cell, tile, dir, left } (left = movimentos que faltam, contando este).
  function bestMove(b) {
    const d = distance(b);
    if (d <= 0) return null;
    const z = b.indexOf(0), nb = b.slice();
    for (const n of ADJ[z]) {
      nb[z] = nb[n]; nb[n] = 0;
      const dn = distance(nb);
      nb[n] = nb[z]; nb[z] = 0;
      if (dn === d - 1) return { cell: n, tile: b[n], dir: dirOf(n, z), left: d };
    }
    return null;
  }
  // Solução ótima completa: lista das peças a deslizar, em ordem.
  function solve(b) {
    const path = [];
    let cur = b.slice();
    for (let m = bestMove(cur); m; m = bestMove(cur)) { path.push(m.tile); cur = slide(cur, m.cell).board; }

  // Fácil/Médio/Difícil: primeiro o mínimo (uniforme na faixa), depois uma posição com esse mínimo.

      want = rng.range(lv.lo, lv.hi);

      if (want >= 0 ? d === want : d >= lv.lo && d <= lv.hi) { if (k-- === 0) return unrank(r); }
    }
    return GOAL.slice();
  }

  const logic = { N, GOAL, LEVELS, rank, unrank, table, counts, distance, isSolved, solvable, dirOf, slide, bestMove, solve, generate };
  if (typeof module !== 'undefined' && module.exports) { module.exports = logic; return; }

    const s = s0 ? clone(s0) : fresh(G), steps = [];
    let top = 0;
    while (s.n < G.N) {
      let st = null;
      for (const t of TECH) { st = first(t, G, s); if (st) break; }
      if (!st || st.lv > maxLv) return { ok: false, steps, top, s };
      apply(G, s, st);
      steps.push(st);
      if (st.lv > top) top = st.lv;
    }
    return { ok: true, steps, top, s };

  // Cores das regiões: todas diferentes e, se der, sem tons vizinhos na roda de cores (0..7) lado a lado. A 8 é neutra.
  const NCOLORS = 9;
  const nearHue = (a, b) => a < 8 && b < 8 && ((a - b + 8) % 8 === 1 || (b - a + 8) % 8 === 1);
  function regionPairs(N, reg) {
    const seen = new Set(), pairs = [];
    for (let i = 0; i < N * N; i++) {
      for (const j of [i % N < N - 1 ? i + 1 : -1, i + N < N * N ? i + N : -1]) {
        if (j < 0 || reg[j] === reg[i]) continue;
        const a = Math.min(reg[i], reg[j]), b = Math.max(reg[i], reg[j]);

  function pickColors(N, reg, rng) {
    const pairs = regionPairs(N, reg), col = rng.shuffle([...Array(NCOLORS).keys()]);
    const bad = () => pairs.reduce((n, [a, b]) => n + nearHue(col[a], col[b]), 0);
    let best = bad();
    for (let t = 0; t < 300 && best > 0; t++) {
      const i = rng.int(N), j = rng.int(NCOLORS);
      if (i === j) continue;
      [col[i], col[j]] = [col[j], col[i]];
      const b = bad();
      if (b <= best) best = b; else [col[i], col[j]] = [col[j], col[i]];

  }

  // Níveis: tamanho, jeito de crescer as regiões e faixa de técnica exigida (top): 1 casa única ·
  // 2 região presa numa linha ou casa que bloquearia outra região · 3 duas regiões presas em duas linhas ·
  // 4 grupos maiores · 5 tentativa curta. minSize 2 = nenhuma região de uma casa só (rainha de graça);
  // minHard = quantos passos de nível 3+ o desafio precisa ter.
  const LEVELS = {
    facil: { N: 5, grow: [0.2, 2.8, 2], minLv: 2, maxLv: 2, minSize: 1, minHard: 0 },
    medio: { N: 6, grow: [0.4, 1.6, 1], minLv: 2, maxLv: 2, minSize: 2, minHard: 0 },
    dificil: { N: 7, grow: [0.4, 1.6, 1], minLv: 3, maxLv: 4, minSize: 2, minHard: 1 },
    muito: { N: 9, grow: [0.4, 1.6, 1], minLv: 3, maxLv: 5, minSize: 2, minHard: 2 },
  };
  // Sorteia rainhas, cresce regiões, garante solução única e confere que dá para resolver só com lógica.
  // Usa só o rng recebido: mesma semente, mesmo desafio. Depois de `tries` tentativas sem achar a dificuldade
  // pedida, aceita qualquer desafio único que a lógica resolva (conta tentativas, nunca o relógio).
  function generate(N, rng, spec = {}) {
    const { grow, minLv = 1, maxLv = 5, minSize = 1, minHard = 0, tries = 600 } = spec;
    for (let a = 1; ; a++) {
      const relax = a > tries;
      const sol = randomQueens(N, rng), reg = growRegions(N, sol, rng, grow);
      if (!makeUnique(N, sol, reg, rng)) continue;
      if (!relax && minSize > 1) {
        const size = new Array(N).fill(0);
        for (const k of reg) size[k]++;

      }
      const res = solve(geo(N, reg), null, relax ? 5 : maxLv);
      if (!res.ok) continue;
      const hard = res.steps.filter(st => st.lv >= 3).length;
      if (!relax && (res.top < minLv || hard < minHard)) continue;
      return { N, reg: Array.from(reg), sol, top: res.top, hard, steps: res.steps.length, attempts: a, colors: pickColors(N, reg, rng) };
    }

  // Conflitos entre rainhas (lista de casas): mesma linha, coluna, região ou encostadas.
  function conflicts(N, reg, qs) {
    const bad = new Set(), pairs = [];

        const i = qs[a], j = qs[b], ri = (i / N) | 0, ci = i % N, rj = (j / N) | 0, cj = j % N;
        const why = ri === rj ? 'linha' : ci === cj ? 'coluna' : reg[i] === reg[j] ? 'regiao'
          : Math.abs(ri - rj) < 2 && Math.abs(ci - cj) < 2 ? 'toque' : null;
        if (why) { bad.add(i); bad.add(j); pairs.push({ a: i, b: j, why }); }

  // Dica: aponta uma rainha fora da solução; senão, acha a próxima rainha dedutível e o motivo.
  // t: 'wrong' | 'single' (já é a única casa livre) | 'after' (depois de um passo de lógica) | 'chain' (vários passos).
  function hintFor(P, queens) {
    const { N, reg, sol } = P, G = geo(N, reg);
    const wrong = queens.filter(i => sol[(i / N) | 0] !== i % N);
    if (wrong.length) {
      const { bad } = conflicts(N, reg, queens);
      return { t: 'wrong', cell: wrong.find(i => bad.has(i)) ?? wrong[0] };
    }
    const s = fresh(G);
    for (const i of queens) put(G, s, i);
    if (s.n === N) return null;
    const one = first(tSingle, G, s);
    if (one) return { t: 'single', cell: one.put, u: one.u };
    let found = null;
    for (const tech of [tLine, tBlock, tGroup]) {
      tech(G, s, e => {
        const t = clone(s);
        apply(G, t, e);
        const x = first(tSingle, G, t);
        if (x) found = { t: 'after', cell: x.put, u: x.u, via: e };

      });
      if (found) return found;
    }
    const t = clone(s), used = [];
    for (;;) {

        const um = G.unit[x.u];
        const touch = used.filter(e => e.el.some((m, y) => m & um[y]));
        return { t: 'chain', cell: x.put, u: x.u, via: touch[touch.length - 1] || used[0] };
      }
      apply(G, t, x);
      used.push(x);
    }
    const r = [...Array(N).keys()].find(y => !((s.dr >> y) & 1));

  // Textos da dica (names[k] = nome da cor da região k).
  function hintText(P, h, names) {
    const N = P.N;
    const cellName = i => `linha ${((i / N) | 0) + 1}, coluna ${(i % N) + 1}`;
    const lineWord = u => (u < N ? 'linha' : 'coluna');
    const unitName = u => (u < N ? `a linha ${u + 1}` : u < 2 * N ? `a coluna ${u - N + 1}` : `a região ${names[u - 2 * N]}`);
    const list = xs => (xs.length < 2 ? xs.join('') : `${xs.slice(0, -1).join(', ')} e ${xs[xs.length - 1]}`);
    const bits = m => [...Array(N).keys()].filter(y => (m >> y) & 1);
    const title = `Rainha na ${cellName(h.cell)}`;
    if (h.t === 'wrong') return { title: 'Rainha fora do lugar', text: `A rainha da ${cellName(h.cell)} não faz parte da solução. Toque nela para tirá-la.` };
    if (h.t === 'reveal') return { title, text: 'Esta rainha faz parte da solução.' };
    const size = h.u >= 2 * N ? P.reg.filter(k => k === h.u - 2 * N).length : N;
    if (h.t === 'single') {
      if (size === 1) return { title, text: `A região ${names[h.u - 2 * N]} tem uma casa só, então a rainha dela fica ali.` };
      const outras = h.u < N ? 'na mesma coluna, na mesma região' : h.u < 2 * N ? 'na mesma linha, na mesma região' : 'na mesma linha, na mesma coluna';
      return { title, text: `É a única casa livre d${unitName(h.u)}: as outras já têm uma rainha ${outras} ou encostada.` };
    }
    const e = h.via;
    let why, so;
    if (e.t === 'regIn') { why = `a região ${names[e.k]} só cabe n${unitName(e.u)}`; so = `nenhuma outra região pode usar essa ${lineWord(e.u)}`; }
    else if (e.t === 'lineIn') { why = `as casas livres d${unitName(e.u)} estão todas na região ${names[e.k]}`; so = `a rainha dessa região fica nessa ${lineWord(e.u)}`; }
    else if (e.t === 'block') { why = `uma rainha na ${cellName(e.cell)} deixaria ${unitName(e.u)} sem casa livre`; so = 'essa casa fica sem rainha'; }
    else if (e.t === 'group') {

      const word = e.byRow ? 'linhas' : 'colunas', nums = m => list(bits(m).map(y => y + 1)), regs = ks => list(ks.map(k => names[k]));
      if (e.regs.length <= e.rest.length) { why = `as regiões ${regs(e.regs)} só cabem nas ${word} ${nums(e.lines)}`; so = `essas ${word} ficam só para elas`; }
      else { why = `as ${word} ${nums(e.restLines)} só têm casas livres nas regiões ${regs(e.rest)}`; so = `essas regiões não podem ter rainha fora dessas ${word}`; }
    } else { why = `uma rainha na ${cellName(e.cell)} levaria a um beco sem saída`; so = 'essa casa fica sem rainha'; }

      const unitCells = u => [...Array(NN).keys()].filter(i => (u < N ? ((i / N) | 0) === u : u < 2 * N ? i % N === u - N : P.reg[i] === u - 2 * N));
      const label = (i, v, bad) => `Linha ${((i / N) | 0) + 1}, coluna ${(i % N) + 1}, região ${names[P.reg[i]]}: `
        + (v === 2 ? (bad ? 'rainha em conflito' : 'rainha') : v === 1 ? 'marcada com X' : 'vazia');

        const i = cellOf(e);

        onUndo() {
          if (ctx.status !== 'play' || !hist.length) return;
          const last = hist.pop();
          st[last.i] = last.from;
          clearHint();
          render();
        },
      };
    },
  });
})();
